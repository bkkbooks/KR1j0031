body:
  text: 復古編序君尊臣卑父坐子立此六經之大閑也大者之學此而已然堯舜稽古之道仲尼時雨之教随噐大小皆使有成則道之有藝之有書小學之􅀁紀亦何可􅆸㢤然而􅀴天緯地之文不在止戈之後閑邪窒欲之義不假皿蟲而知其覺也晚然後字書小學亦有可􅀚者焉􅀚矣而不可泥棄本根而尋枝葉認漚體而舎􅈚渤譬猶壓沙取油用力雖多而終無􅀁淂其􅀁成􅈬者可知也已呉興張謙中習蒃籀行茟圓勁淂李斯陽冰之法校正俗書与古字戾者采摭經傳日考月挍久而不觧元豊中予官方吳興見其用心之初今廿有九年然後成書凡集三千餘字名曰􅂧古編其说以谓專取㑹意者不可以了六書離析偏㫄不可以見全字求古人之心而覔糟粕固以永矣又取一全體鑿為多字情生之说可说可玩而不􅁕以消人之意譬猶入海筭沙無有畔岸運籌役志迷不知改豈特逹如輪扁然後能􅀏其誤㦲徃揚子雲留意古道用之于玄􅂉􅀏其自苦或譏其作􅀴然子雲意在賛易非与易竸而劉歆之徒方计目前利害無意扵古覆醬瓿之语􅁕以彂子雲之一􅀏而己今玄子雲又千有馀􅀊士守􅀁學而不能忘􅂧古之志者可不谓之難淂也㦲谦中用心于内不務進取一裘一葛專趣内典予方杜门待盡亦讀法界之書嘗闻􅀥柏之言曰作器者先湏立様造車者當使合轍古無今有即是邪道不可學也予嘗三􅂧此语因思學道之要不以古聖為様轍者皆外逰尓尭舜禹􅆏陶之􅀁谓稽古者豈特可以為方内之法㢤􅆀逺􅂲泥尚不可以違轍様而况大學之道乎後之好古者􅀚俗尚論􅀅有稽于此焉大􅀚四年十一月叙復寕德郎陳􅗕序
