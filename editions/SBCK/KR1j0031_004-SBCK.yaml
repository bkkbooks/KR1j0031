seq: 4
front:
  text: 後序程子曰學之不可以不專也涉其流者未有能極其原㳺之蕃者未有能覩其奥不極其原不覩其奥求其是且精焉無有也作自繹山真􅈓不傳至唐字學雖盛而以􅂐法盖一時名後世者唯李陽冰為稱首徐鉉後出茟力勁古遂出陽冰上近世名茟固多其分閒布白規圜繩直不其傳因次叙如此政和二年􅀊癸已九月朔信安程俱叙復古編序書名之作其來尚矣自伏犧造書契而文籍生降及三代因革不同蟲魚萆木之形變於周史逮至秦漢作者閒出李斯趙高作蒼頡爰歷之書一變而爲小篆軍正程邈便於簡易再變而爲隸魏􅀳以來籀篆旣泯唯眞萆盛行至唐韓擇木李陽冰踵嶧山秦望之餘近代徐鉉宗陽氷之法復以小􅂐行於世然去古彌逺未有能臻其妙者呉興張謙中先生素留心此學深造古人之妙自元豐以來以小􅂐箸名天下鮮儷焉鄉人徐滋元象舊與先生爲鄰親炙先生餘誨揮毫落紙得先生之法先生亦雅愛奇之其平昔所箸如復古編千字文之􅀋屬纊之際盡以遺之藏于巾笥如獲大寳今將􅍢板勒碑以廣其傳於永乆命㒒作序以誌之聊書其梗槩云時紹興十三年七月六日王佐才序敍復古編新序加新字􅀁以別扵原序也極是之文字之書世謂之小學或者因陋就簡􅃌爲學之細事而忽之非也古者四民擇其秀者爲士而教之所謂八歲入小學者敎以禮樂射御書數是六者雖不見古人之大全周禮注䟽亦見其略是皆有名數法度及人之幼眞淳未散記識性全使習六蓺則終身可以爲用此爲小年之學非曰學者之小事禮壞樂崩射御弗習數學亦復罕傳猶幸六書之說具存凡將爰歷等書不可復見急就章止存大略惟許叔重箸說文解字垂範千載李陽氷中興斯文於唐􅀂南唐二徐兄弟尤深此學楚金在江南旣爲通釋部叙通論袪􅄭􅀋聚錯綜疑義系述等篇總謂之繫傳又箸韻譜備矣鼎臣入本朝事熈陵命校定叔重之書至今賴之爾後楊南仲章友􅀡文勛邵疏陳晞諸公皆以篆鳴遺迹猶辬辬見之然不聞有書以惠後來吳興張有謙中篤志古道傷俗學混淆爲書一編號曰復古用功數十秊書成於大觀政咊之閒陳了齋程北山爲歬後敍稱美甚至足以不朽矣鑰晚出何敢容喙尚有欲言而未盡者謙中攷證精詣字之合於古者皆所不論惟俗書亂之者必正其譌舛豪釐不貸讀者說服無有異論聞其落筆作篆如眞行然略無艱辛之態惟體脩而末重與人小異不入俗目漢宣帝時器械工巧元成閒鮮及之有谷口銅甬傳于卋欵識字其體正爾始知謙中之作葢有自來非以意爲之也巍字从委从嵬或省山以爲韓魏之魏謙中爲林中書家篆墓碑終不省去山字古無菴字謙中以謂當作闇而難以題扁山谷雖定从艸謙中􅎣不用也嘗篆楊􅀛山所作踵息菴記終篇偶無此字碑頟雖从广竟作隸體書之其信古不从俗􅀋􅀂此鑰不能作篆心顧好之陽冰新義猶爲楚金所祛使二徐見此編殆􅎣無以訾之陽冰務新而謙中一意于古優劣可以坐判矣時嘉定三秊八月朔正奉大夫參知政事兼奉化郡開國公食邑叄仟壹伯戸食實封陸伯戸四朙樓鑰敍于攻媿齋
