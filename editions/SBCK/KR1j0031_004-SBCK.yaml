body:
  text: 小斆周官六􅴳之一也敎國子入何􅇀由斯儻以爲斆之事而忽之則指辵踔爲之繞宀緜爲両立若此者衆何其誤哉不遇指􅀯曷从正徹吳興張有謙中號眞靜翁于國朝徐鼎臣校定
  hash: sha256:ffca007fc8699495bec8f006b54cdf800504de4ec624cab59f5a80294d661ce5
