seq: 4
body:
  text: 後序程子曰學之不可以不專也涉其流者未有能極其原遊之蕃者未有能覩其奧不極其原不覩其奧求其是且精焉無有也作自繹山真刻不傳至唐字學雖盛而以篆法蓋一時名後世者唯李陽冰為稱首徐鉉後出茟力徑古遂出陽冰上近世名茟固多其分間布白規圜繩直不其傳因次敘如此政和二年歲癸已九月朔信安程俱敘復古編序書名之作其來尚矣自伏犧造書契而文籍生降及三代因革不同蟲魚萆木之形變於周史逮至秦漢作者間出李斯趙高作蒼頡爰歷之書一變而為小篆軍正程邈便於簡易再變而為隸魏晉以來籀篆既泯唯真萆盛行至唐韓擇木李陽冰踵嶧山秦望之餘近代徐鉉宗陽氷之法復以小篆行於世然去古彌逺未有能臻其妙者吳興張謙中先生素留心此學深造古人之妙自元豐以來以小篆箸名天下鮮儷焉鄉人徐滋元象舊與先生為鄰親炙先生餘誨揮毫落紙得先生之法先生亦雅愛奇之其平昔所箸如復古編千字文之類屬纊之際盡以遺之藏于巾笥如獲大寶今將􅍢板勒碑以廣其傳於永久命㒒作序以志之聊書其梗槩云時紹興十三年七月六日王佐才序敘復古編新序加新字所以別于原序也極是之文字之書世謂之小學或者因陋就簡指為學之細事而忽之非也古者四民擇其秀者為士而教之所謂八歲入小學者教以禮樂射御書數是六者雖不見古人之大全周禮注疏亦見其略是皆有名數法度及人之幼真淳未散記識性全使習六藝則終身可以為用此為小年之學非曰學者之小事禮壞樂崩射御弗習數學亦復罕傳猶幸六書之説具存凡將爰歷等書不可復見急就章止存大略惟許叔重箸説文解字垂範千載李陽氷中興斯文於唐若南唐二徐兄弟尤深此學楚金在江南既為通釋部敘通論袪妄類聚錯綜疑義系述等篇總謂之繫傳又箸韻譜備矣鼎臣入本朝事熙陵命校定叔重之書至今賴之爾後楊南仲章友直文勛邵疏陳晞諸公皆以篆鳴遺迹猶辬辬見之然不聞有書以惠後來吳興張有謙中篤志古道傷俗學混淆為書一編號曰復古用功數十年書成於大觀政和之間陳了齋程北山為歬後敘稱美甚至足以不朽矣鑰晚出何敢容喙尚有欲言而未盡者謙中考證精詣字之合於古者皆所不論惟俗書亂之者必正其訛舛豪釐不貸讀者説服無有異論聞其落筆作篆如真行然略無艱辛之態惟體修而末重與人小異不入俗目漢宣帝時器械工巧元成間鮮及之有谷口銅甬傳于卋欵識字其體正爾始知謙中之作蓋有自來非以意為之也巍字從委從嵬或省山以為韓魏之魏謙中為林中書家篆墓碑終不省去山字古無菴字謙中以謂當作暗而難以題扁山谷雖定從草謙中􅎣不用也嘗篆楊龜山所作踵息菴記終篇偶無此字碑額雖從廣竟作隸體書之其信古不從俗類若此鑰不能作篆心顧好之陽冰新義猶為楚金所祛使二徐見此編殆􅎣無以訾之陽冰務新而謙中一意于古優劣可以坐判矣時嘉定三年八月朔正奉大夫參知政事兼奉化郡開國公食邑叄阡一伯戶食實封陸伯戶四明樓鑰敘于攻愧齋小斆周官六􅴳之一也教國子入何草由斯儻以為斆之事而忽之則指辵踔為之繞宀綿為兩立若此者衆何其誤哉不遇指南曷從正徹吳興張有謙中號真靜翁于國朝徐鼎臣校定
