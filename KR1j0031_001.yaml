front:
  text: 雨也從水蒙別作濛非折􅯅生衣也從酉冡別作䤓非匆多遽匆匆也從心囱別作忩非倉紅切㚇斂足也從夊凶別作非祖紅切文四折稯布之八十縷也從禾㚇別作緵非折堫種也從土㚇別作堫非沖涌搖也從水中別作沖种並非直弓切腫血也從血農省或作膿別作癑非奴冬切衝通道也從行童別作衝非昌容切襛衣厚貌從衣農別作穠非尼容切龍鱗蟲之長從肉飛之形童省別作龍並非力鍾切鏠兵專也從金逢別作鋒非敷容切文四折烽燧候表也從火逢別作烽非折蜂飛蟲螫人者從䖵逢別作蜂非折使也從彳夆別作非雍雍􅼵也從隹雍別作雍噰嗈並非於容切文三雍四方有水自雍城池者從川邑別作壅非折癰腫也從疒雍別作臃非㼸器也從瓦容別作非餘封切文三折墉城垣也從土庸別作墉非折猛獸也從豸庸別作㺎非邛地名也從邑工別作笻非渠容切逢遇也從辵峯省別作逄非符容切又步江切鏦矛也從金從或作鏦別作非七恭切又楚江切杠石橋也從木工別作矼非古雙切腔肉空也從肉空别作羫非苦江切雙隹二枚也從雔又持之作雙並非所江切邦國也從邑丰別作邦非博江切囱在屋曰囱或作窗窗别作窗非楚江切橦帳極也從木童別作幢俗宅江切肢體四肢也從肉只或作肢別作並非章移切䙾司人也從見它別作並非式支切文四軙也從攴也別作􆂠敆並非折絁粗緒也從糸璽別作絁非折匜短矛也從金它別作鍦並非又食遮切籭竹器也從竹麗別作篩非所宜切斯析也從斤其別作廝廝並非息移切􅐔不相值也從左􅑰別作差從匕非又楚宜切文二􅚖齒參􅐔也從齒􅐔別作非周行也從网米或作折同武移切別作穼音深竈突也文二镾久長也從長爾別作彌非鬻鍵也從鬲米武悲切今別作粥音之六切以鬻音余六切訓賣也別以麋為饘麋字訛麋鹿屬也糜糝也從米麻別作􅪪並非靡為切文二折􅓱穄也從黍麻別作麇非跂足多指也從足支別作歧非巨移切隓敗城􅊟也從􅊟折或作􅤚別作墮非許規切規有法度也從夫見別作規規並非均窺切文二巂周燕也從隹􅋄訥別作雉鳺並非又户圭切窺小視也從穴規別作並非去隓切踦一足也從􅟦竒又旅寓也別作羇非去竒切齍黍稷在器以祀者從皿齊別作璾非即夷切旌旗指折也從手靡別作麾非許為切虧氣損也從亏雐或作虧別作虧非去為切葰薑屬從草俊別作荽荾並非息遺切墀塗地也從土犀別作非直尼切尼從後近之從尸匕別作非女夷切􅵁折也從隹氐別作非處脂切胝腄也從肉氐別作疷䟡並非張尼切鬌髮隋也從髟隋省別作非直追切纍綴得理也一曰大索從糸畾別作縲非力追切文二欙山行所乘者從木纍別作樏非夔神魖如龍一足從夊象形别作非渠追切文二戣周禮侍臣執戣從戈癸別作鍨非欹持去也從支奇別作欹非去奇切齝吐而噍也從齒台別作非丑之切檯耒專也從木台別作非盈之切文三折飴米煎也別作䬮􅏁並非折詒相欺詒一曰遺也別作貽俗醫治病工也殹惡姿也一曰病聲從酉酒所以治病也別作醫從巫束也從􅱮韋俗作從束非于非切􅤀以血有所刉祭也別作禨非渠稀切虛大丘也從丘虍別作墟非丘如切又朽居切岨石山戴土也從山且別作砠非七余切文二折䏣蠅乳肉中也從肉且別作蛆非鴡王鴡也從鳥且別作睢非鉏立薅所用也從金且別作鋤非七魚切豬豕也從豕者又水所停者別作豬瀦並非陟魚切疏通也從㐬折別作踈非所菹切摴舒也又摴蒲戲也從手雩別作攄非丑居切文二㯉木也折一曰惡木也從木呼今作㯉乎化切與穫同以其皮裹松脂者専布也從寸甫別作敷非芳無切文二折左扶風縣也從邑麃作鄜非余語之舒也從八舍省以諸成遮二切別作豫非文二輿車也從車舁别作輿非鳬舒鳧鶩也從鳥几俗作鳬從几非房無切臞少肉也俗肉瞿俗作癯非其居切文七折鴝鵒也從鳥句別作鸜非折躍行貌從足瞿別作忂非跔夭寒足跔從􅟦句別作局非折鑺戟屬也從金瞿別作瞿非折斪斫也從斤句別作非走顧貌從走瞿別作𧾱非柎闌足也從木付別作跗趺並非甫無切吁驚也從口于又冕也殷曰吁別作􅒐並非况于切須面毛也折從頁彡借為所須字別作鬚非相俞切又作須荒內切與沫同芻刈草也象包束草之形別作芻並非窗俞切為茗此即今之茶字爐方爐也從金盧別作爐非洛乎切也從黍古或作糊別作糊並非户吳切烏考鳥也象形別作嗚非哀都切粗行超逺也從三鹿此非精粗字別作粗非倉胡切文三粗疏也從米且別作麆粗並非又徂古切穌把取折禾器也從禾魚一曰死而更生別作蘇非素孤切利也從金折別作非徂奚切氐至也從氏下一一地也一曰下也都兮切又丁禮切別作低非古文二隄塘也從􅊟是俗用堤非堤音丁禮切滯也溪山瀆無所通者從谷奚別作溪非苦兮切麑狻麑也從鹿兒別作猊非五雞切􅔊反手擊也從手別作批非匹齊切􅩪牢也所以拘非也從非陛省別作狴並非邉兮切非聲也從言斯省別作嘶非先稽切咼口戾不正也從口冎別作喎並非苦媧切柴小木𣪚材從木此師行野次豎木為區落名曰柴蘺後人語訛轉入去聲別作寨者非士皆切階陛也從􅊟皆別作階非古諧切椑折籍也從木卑別作牌非部皆切又步迷切圜榼也步􅟪切親身棺也賔彌𥘉柿也薶瘞也從草貍別作埋非莫皆切回轉也從口中象回轉之形別作徊回並非户恢切文二蛔腹中長蟲也從蟲有別作蛔非灰死火餘折也從火又別作灰從廠非呼恢切胚婦孕一月也從肉不別作胚非朘赤子隂也從肉夋或從血別作非子回切曲頥也從頁不別作䯱𩑢𩑢並非蒲枚切臺觀四方而髙者從至從之從高省別作臺非徒哀切文二菭水衣也從草治別作苔非思容也又頷也從囟從心別作腮腮䰄並非穌來切又息茲切真仙人變形而登天也從匕從目從􅡊八所乘載也別作真非側鄰切謓恚也從言真昌意切別作嗔非嗔他年切水渡也從水􅩎別作津俗將鄰切文二折璉石之似玉者從玉進別作瑨非瀕水崖人所賔附頻戚不前而止從頁涉别作濵非符真切文三薲大萍也從草賓別作蘋非折玭珠也從玉比或作別作非份文質倫也從人分古文作彬別作斌以文配武過為啚淺又作贇音頵亦於義無取悲申切筋肉之力也從力從肉從竹別作筋非居銀切㹞犬吠聲從犬斤別作狺非語巾切麇麞也從鹿囷省籀文不省別作麏非居筠切文錯畫也象交文別作紋非無分切文二折低目視也又鄉名從􅡚門別作閿並非􅜶除田間薉也從耒員或作別作耘俗羽文切繁馬尾飾也從糸每別作繁俗附袁切文二折燓燒田也從火樊別作焚非又符分切塤樂器也以土為之六孔從土熏別作塤非況袁切文三暖溫也從火爰別作暄非折吅驚呼也褌折也從巾軍或作褌別作裩非古渾切文二折䖵蟲之總名從二蟲別作蜫非炮肉也以微火溫肉從火衣作煾非烏痕切奔走也從夭賁省別作奔非博昆切豚小豕也從彖省象形從又持肉或作豚同別作豚非徒魂切文二髀也從尸下丌几或作脽並同別作臀非奠酒器也從酉廾以奉之或從寸俗為尊卑之尊別作樽撙並非祖昆切村地名也從邑屯別作村非此尊切怒也詆也大也勉也又一成為敦立江東呼地高堆為別作墩非都昆切虋赤苗嘉榖也從草釁别作􅚂非莫奔切犴胡地野犬名從豸干或作犴別作貋犴並非河干切乾出上也從乙從倝別作乾漧並非古寒渠焉二切單大也從吅卑吅聲卑闕都寒切又上演切別作非闌門遮也從門柬別作欄攔並非洛干切寬屋大也從宀莧別作寬並非苦官切冠絭也辨冕之總名從冖從元從寸別作冠非古丸切攢積竹杖折也從木贊別作攢從手非才官切文二折菆麻蒸也一曰蓐也從草取案周禮為塗菆字別用攢非又側鳩切彎持弓關矢也從弓􅒋別作灣非烏關切鍰鋝也從金爰虞書曰罰百鍰別作鐶非胡關切文二環璧也玉好若一謂之環別作鐶非辬駁文也從文辡今用班從與刀分瑞玉也別作斑非逋還切髮貌從髟臱別作鬘非莫班切又莫賢切掔固也從手臤別作慳非苦閖切文二折􅵾狠視也從二見肩別作覸非
