body:
  text: 下平聲箋表識書也從竹戔別作箋非則前切歬不行而進謂之歬從止在舟上隸作前昨先切賢多才也從貝臤別作賢非胡田切文二折弓弦也從弓從􅏏象形別作絃非豜三歲豕肩相及者從豕开別作􅢢非古賢切䅌麥莖也從禾肙別作非古玄切縣繫也從系持􅹁借為州縣之縣別作懸加心非胡涓切長生折去從人別作仙非相然切遷登也從辵折別作遷並非七然切涎慕欲口液口從水欠別作涎非敘連切然燒也從火肰別作燃非如延切廛一畝半一家之居從廠從里從八從土別作鄽壥並非直延切攐摳衣也從手褰別作攓非去虔切文三折愆過也從心衍或作㥶愆別作愆非折褰褲折也從衣寒省別作非綿聯微也從系帛別作綿非武延切同完也從入工或作玉純玉曰同道書以同為同字疾緣切銓衡也從金全別作硂拴並非此緣切圜天體也從囗睘王權切俗用圓非圓王問切鷙鳥也從鳥屰別作鳶鶚並非與專切又五各切捲氣勢也從手卷國語曰有捲勇一曰收也巨貟切今俗作居轉切以為舒捲之捲文三折曲角也從角别作非䟒行䟒逯也一曰行曲脊貌從走雚別作非貂鼠屬大而黃黑出胡丁零國從豸召別作鼦非都僚切􅳍斛旁有􅳍從斗折一曰突也一曰利也爾雅曰􅳍謂之疀古田器也別作􅳍鍬並非土雕切文二折佻愈也從人從兆別作恌非􅓒草木實垂􅓒􅓒然象形徒遼切別作卣非又由酉二音鼂匽鼂也從黽從旦或作從別作朝非直遙切竂穿也從穴尞別作寮非洛簫切猋犬走貌從三犬爾雅貝居陸曰猋在水曰蜬別作贆非甫遙切搖動也從手䍃別作颻非余招切文四折繇隨從也從系從䍃別作繇繇並非折䍃徒歌也從言别作謠茮莍也從草叔別作椒非子寮切從水朝省隸作潮俗直遙切肴啖也從肉爻別作肴非胡茅切茅菅也從草矛別作茆非莫交切文二貓狸屬從豸苗別作貓非巢鳥在木上曰巢在穴曰窠從木從川從􅍫象形別作非鉏交切筲飯器也從竹捎別作筲非所交切豕鬛如筆管者從折從高籀文作豪又九江郡古鍾離國隋改作州別作濠毫並非乎刀切鈔又取也從金少別作抄非楚交切又楚教切夒貪獸也一曰母猴從人從頁已止夊象形別作猱非奴刀切􅔟獄之兩曹也從日從㯥隸作曹俗作曺非昨牢切丁反折丂也丂氣欲折舒出折上礙於一也反丂氣己舒也別作呵非虎何切詑欺也從言它別作訑並非徒何切文三折它蟲也象形或作他負何也別作他從人也非折蛇本與它同或從蟲它俗作食遮切別作蛇非衰草雨衣也從衣象形別作蓑非穌和切䣜沛國縣也從邑虘昨何切今以鄼為䣜陽恐非鄼音作管切聚也百家為鄼文三折鹹也從鹵差省隸作別作醝非目小也從目堊元首叢叢猶細碎也作脞非媻奢也從女般別作婆非薄波切捼手相摩也從手委別作挼撋並非奴禾切又儒垂切騾驢父馬母從馬􅢓或作別作騾非洛戈切文三也從金䇔別作鏍非折螺蜾屬也蜾螺也一曰蚌屬從蟲􅢓別作螺非鞮屬從革􅏞別作靴非許切沙水𣪚石也從水從少別作砂紗並非所加切􆄡箠也從竹朵別作撾檛並非陟瓜切瑕小赤玉也從玉假一曰赤雲氣後人俗別作霞乎加切文三徦至也從彳假一曰逺也後人別作遐又古雅切𩏇履也從韋假別作非邪琅邪郡從邑牙別作琊耶並非以遮切文二折釾鏌釾也從金牙別作鋣非麚牡鹿也從鹿假夏至解角別作麚非古牙切文三痂疥也從疒加別作非折􅰿互令不得行也從辵枷別作迦俗牙牡齒也象上下相錯之形一曰古者軍行有牙尊者所在後人因以所治為牙今別用衙非五加切􅏞榮也從草􅒧別作花非户瓜呼瓜二切文二折㭉兩創折從木􅘲象形或作釫別作鏵非雅楚鳥也從隹牙別作鴉鴉並非烏加切又五下切窊汙邪下也從穴瓜烏瓜切又作窳以主切汙窬也別作溛非柤木間也從木且別作查楂並非側加切咨也從言􅐔別作非子邪切瑲玉聲也從王倉又管磬折當用鳥獸牄牄當用牄別作鏘並非七芉切漿酢漿也從水將省隸作漿即良切牆垣蔽也從嗇爿別作墻非才良切從外知內也從冏章省別作商非式陽切倡樂也從人昌別作娼非尺良切創傷也從創從一刀有兩利者或作創別作瘡非楚良切麞麋屬也從鹿章別作獐非諸良切鷞鷫鷞也從鳥爽別作鸘非所莊切莊從草壯別作莊莊並非側羊切文二折妝飾也從女牀省別作糚非牀安身之坐者從木爿爿則疒之省至於牆壯戕狀之屬並當從牀薑禦溼之菜也從草強别作薑非居良切文三折疆界也從疆從三其界畫也或作強別作壃非折韁馬紲也從系疆別作韁非強蚚也從蟲弘弘從某某與同別作強強從口並非巨良切芳也從黍甘隸作杳俗許良切唐大言也從口庚一曰隄也別作塘俗徒郎切郎魯亭也從邑良一作東西序也後人俗別作廊魯當切鼞鼓聲也從鼓堂別作鞺並非土郎切臧善也匿也從戕臣別作折非又作藏俗則郎切又昨郎切芒草專也從草亡又􅉭􅉭廣大貌又蒼􅉭也別作茫忙並非武方切山折也從山网隸作岡別作岡罡非古郎切􅣆方舟也從方亢大夫方舟別作航非胡郎切大也從自王自始也始折者三大君也別作凰非胡光切庚位西方也庚承已象人齎又鳥名黃倉庚別作鶊非古行切文二粳稻屬也從禾亢或作粳別作粳非􅤶門內祭先祖所以倣徨從示彭或作祊別作閍非補盲切樘邪柱也從木堂別作撑非丑庚切莔貝母也從草明省別作非武庚切平語平舒也從亏從八八分也別作評非蒲兵切黥墨形在面也從黑京或作黥別作剠非渠京切精擇也從米青又目童也別作睛非子盈切夝雨而夜除星見也從夕生別作晴非疾盈切觲用角低仰便也從羊牛角別作觪非息營切文三馬赤色也從馬觲省別作騂非折垶赤剛土也從土觲省別作垶非甹亟詞也俠也從丂由別作非普丁切聽聆也從耳㥁壬古者治官處謂之聽事後人別作廳非他丁切文二折綎糸綬也從系廷別作綎鞓並非亭民所安定從高從丁省俗作停特丁切靈巫以玉事神從王霝或作靈從巫後人作齡俗别作靈並非郎丁切文三折蛉蜻蛉也從蟲令別作蜓音徒典切蝘蜓也麢大羊細角從鹿霝別作羚非升十籥也從斗象形後人作升俗別作升非識蒸切稱銓也從禾爯別作稱非處陵切驚聲也從乃省從西一曰往也如乘切別作乃音奴亥切非馮馬行疾從馬仌一曰依也別作憑非皮氷切又房戎切􅊹清也從水徴省別作澄非直陵切菱芰也從草淩或作同別作菱非力膺切競也從二兄丰一曰敬也隸作兢俗居陵切禮器也從廾持肉在豆土別作登㽅並非都滕切文二鐙錠也從金登別作燈非稜柧稜也從夌木別作稜楞並非魯登切古鳳字鳳飛羣鳥從以萬數故以為朋黨字隸作朋步朋切文二鵬亦古文鳳字隸作鵬字矰隿射矢也從矢曾別作非作滕切弘弓聲也從弓某某古文肱別作弘弘並非胡肱切疣贅也從肉尤別作疣非羽求切休息止也從人依木或作庥別作茠烋並非許尤切文二髹黍也從黍髟別作髹非甹木生條也從丂由今俗作由非以周切文四攸行水也從攴從人水省別作攸從丨非修等字皆從攸氣行貌從乃省從􅓒別作從辵􅒾非猶玃屬也弋道若也別作猷非耰摩田器從木憂別作耰非於求切文三折憂和之行也從夊折詩曰布政憂憂別作非折嚘語未定貌從口憂一曰折嚘氣逆也老子終日號而不嚘別作嚘嗄並非􆈛耕治之田也從田象耕屈之形或作􅴣隸作疇直由切文二禪帳也從巾􅴣俗作禱音都牢切𬒮也隸作幬別作折非又重朱切修脯也一曰長也從肉攸別作翛並非思邀切又思留切盩引擊也從幸攴見血也扶風有盩厔縣俗作盩從執非張流切棄也從攴􅔧周書以為討詩云無我兮別作魗非市流切兔罝也從网否隸作罘俗縛牟切餱乾食也從食矦別作非乎溝切䯽髮貌從髟咅作非步矛切文二折衣博從衣􅱱省一曰聚也別作裒褒並非又博毛也牟牛鳴也從牛象其聲氣從口出隸作牟從某非又目童子謂之牟別作眸非文二折敄強也北燕之外相勉努力謂之敄從攴矛作劺非又亡遇切兜鍪首鎧也從折從貌省別作非當侯切偷巧黠也從女俞通用愈別作偷非託矦切句曲也從口丩別作勾非古矦切又古候九遇二切侵漸進也從人又持帚若掃之進又手也隸作侵七林切繹理也從工口又寸彡工口亂也寸分理之又度人兩臂為八尺也別作尋非徐林切針所以縫也從金咸別作針非職深切曑商星也從晶鬒或作別作參非所今切文二參人參藥草從草􅒓別作非砧石柎也從石占別作枮砧椹並非知林切㻠寶也從王湥省別作非丑林切䘳衽也從衣金別作襟非折襟衣系也從系今古作襟別作襟非珡禁也神農所作象形隸作琴俗巨今切文二折擒急持衣䘳也從手金或作擒同別作擒非邱丘覃國也從邑折覃俗作談非説文注義有談長疑後人傳寫之誤徒含切燅於湯中爚肉也從炎熱省或作別作燖非徐鹽切􅐖頰須也從須折別作髯非汝鹽切文三折梅也從木折別作楠非折多語也從言別作喃非奩鏡奩也從竹斂別作奩奩並非力鹽切黏相箸也從黍占作粘非女廉切沾水名一曰益也從水占別作添非他廉切嗛口有所銜也從口兼別作􅋦非户監切玪折石之次玉者從玉今別作瑊非古咸切麙山羊而大者細角從鹿咸別作羬非胡讒切檆木也從木煔別作杉非所銜切文二折旌旗之遊也一曰衣也從糸別作衫後人所加凡最括也從二二偶也從􅗵􅗵古文及別作凡非浮咸切文二帆馬疾步也從馬風別作帆並非上聲董草名一曰蕅根一曰正也督也從草童別作董非多動切直項貌從女同別作非他孔切懵不明也從心夢別作懵非武總切又武亘切總聚束也從糸匆別作捴揔惣並非作孔切澒丹砂所化為水銀從水項別作汞非呼孔切脛氣足腫從疒童或作別作並非豎勇切穴𣪚也從人在宀下別作冗非而勇切文二毛盛也從毛隼書曰鳥獸毛別作氄非􅋏懼也從心雙省別作悚非息拱切文二折生而聾曰折從耳從從省隸作聳不省奉承也從手廾從折別作捧俸並非扶勇撫勇房用三切蟲丰別作蚌非紙絮一苫也從糸氏別作紙非諸氏切弛弓解也從弓也或作同別作弛非施氏切㢋廣也從廣侈別作㢋扅並非尺氏切邇近也從辵爾別作邇非兒氏切屣舞履也從􅟦麗或作同別作屣非所綺切文三􅨌鞮屬從革徙別作屣非折纚冠織也從糸麗別作縰非繠垂也一曰草木􅏞繠從惢糸別作蘂俗玉篇作蕤同如壘切小兒從人囟別作佌非斯氏切􅾸骨中脂也從骨隓別作髓非息委切識也藏也玉篇云鳥喙也從此朿遵誄切別作觜音遵為切鴟舊頭上觜角也一曰星名將支切迆邪行也從辵從也別作迤非移爾切跬半步也從走圭別作跬非丘弭切蟻蚍蜉也從蟲豈別作蟻非魚綺切文二折檥幹也又泊舟也從木義別作艤非又魚羈切戺本古熙字俗音牀史切以為階戺之地芉鳴也從羊象聲氣與牟同意別作咩非綿婢切旨美也從甘匕古文作別作非職稚切􅧚糞也從草折省別作屎非式視切􅴩野牛而青象形古文作兕別作非徐姊切絫增也從厽從糸絫十黍之重也別作纍非力軌切讄禱也從言畾或作同別作非唯諾也從口隹別作非以水切秕不成粟也從禾比別作粃非卑履切非虛里切又苦亥切㥋痛聲也從心依孝經曰哀不㥋別作偯非於豈切巨規巨也折從工象手持之或作矩者其中正也別作矩非其吕切文四苣束葦燒也從草巨別作炬非折歫止也一曰搶也一曰超也從止巨別作拒非折鐘鼓之柎也飾為猛獸從虍異象其下足或作􅶅鐻同別作􅶅並非野郊外也從里豫古作壄別作墅非羊者切又承與切旅軍之五百人為旅從偃從從又禾自生也別作櫓梠並非力舉切􅢕麋鹿羣口相聚貌從口虞別作麌非魚矩切傴僂也從人區俗別作非於武切欨吹也一曰笑意從欠句別作詬非火羽切又况于切府文書藏也從廣付別作腑非方矩切文二折俯低頭也從頁逃省又作俯同別作俯非鵡鸚能言鳥也從鳥母別作鵡非文甫切主鐙中火主也從折象形形亦聲別作炷非之庾切豎立也從臤豆別作竪非臣庾切庾水槽倉也從廣臾別作㢏非以主切文四折庾量也從斗􅿼別作斔匬並非折愈病瘳也從疒俞別作愈非折窳汚窬也從穴㼌別作窪非又窳渾邑名虜獲也從母從力虍俗作虜從男別作虜並非郎古切文四鹵西方鹹地也從西省象鹽形別作滷瀂並非櫓大盾也一曰所以進船也或作櫓別作櫓非鐪煎膠器從金虜別作鏀非汻水崖也從水午別作滸非呼古切鼓郭也春分之音從壴􅠭別作鼓並非公户切芐地黃也從草下別作蘆非矦五切塢小障也一曰庳城從􅊟烏別作塢非安古切鮆飲而不食刀魚也從魚此別作鱭非徂禮切䋛繡文如聚細米也從糸米別作非莫禮切抵觸也從牛氐別作抵非都禮切體總十二屬也從骨豐別作體躰並非土禮切欚江中大船名從木蠡別作􅿍非盧啓切髮貌從髟爾別作非奴禮切文四折檷絡絲檷也從木爾別作鑈非折禰親廟也從示爾别作你非𩰞智少力劣也從門爾別作􆈂非鬥音都豈切盡器中空也從皿㶳慈忍切又即忍切禮記曰虛坐盡前別作儘非祳社肉盛折以蜃故謂之祳天子所以親遺同姓從示辰別作脤非時忍切筍竹胎也從竹旬又筍虡所以縣鐘鼓也別作笋箰並非思允切準平也從水隼別作準非之允切􅩋膝專也從骨賓別作非毗忍切閔弟者在門也從門文別作憫非眉殞切文二折愍痛也從心暋別作愍非紖牛系也從系引別作絼非直引切卺謹身有所承從巴丞別作並非居隱切隱蔽也從􅊟㥯又安也別用穩非於謹切又音烏本切薀積也從草溫別作藴非於殞切暖溫也從火耎別作暖非乃管切䊎粉也又摶也從米卷别作並非去阮切挽引之也從車免別作挽非武逺切文二折娩生子免身也從子免説文折無免字疑折此字從省通用為解免之免本音芳萬切宫中道也從折象宫垣道上之形別作非苦本切文二棞門橛也從木囷別作閫非鯀魚也從魚系又禹父名也別作􅕐非古本切繜衣狀如襜䄖者從系尊楊倞注荀子云繜與撙同或作僔説文作樽從士俗作撙從手非祖本切䐣切孰肉內於血中和也從肉員別作􅍧非穌本切囤篅也判竹圜以盛穀也從竹從屯別作囤非徒損切侃剛直也從信折信古文信字從川取其不舍晝夜也別作侃非空旱切皯面黑氣也從皮干別作皯並非古旱切碗小盂也從瓦卯或作碗同別作碗非烏管切面慙赤也從灻􅭋二音人善切俗作赧從􅭋與􅭋少異㞋音服從卩又㞋從尸又別作赧非女版切版判也從片反別作板從木非布綰切阪坡也一曰澤障一曰山脅也從􅊟反別作坂非部版切又府逺切限阻也一曰閾也從􅊟艮別作非下簡切柬分別簡之也從束八別作揀非古限切撚執也一曰操也從手然別作捵非乃殄切繭𧖟衣也從糸從蟲別作繭非古典切文二小束也從束幵別作非鞙大車縳軛靼也從革肙一曰佩玉貌別作㻆䩙並非胡犬切􅿘秋田也從犬璽別作獮非文二折鮮是少也從是少別作鮮非俴淺也史記能薄而材俴從人從戔別作譾非慈衍切具食也從肉􅵗別作膳非常衍切文二折鱓魚名似蛇者戰國䇿曰蠶似蜀鱓似蛇從魚單別作鱔非嫩好貌從女耎而沇切案切韻又奴困切別作軟嫩並非僎具也從人巽或作撰同別作撰非士免切槤瑚槤也從木連別作璉非里典切緬微絲也從糸面別作􅒺非彌沇切文五折勒靼也從革面別作非折愐勉也從心面別作􅣼非黽蛙黽也從它象形一曰勉也別作僶勔並非湎沈於酒也從水面別作湎並非辨治也從言在辡之間別作辨非平免切轢也車所踐也從車㞋別作碾非尼展切沇水名從水允別作兖並非以轉切蹇跛也從足寒省別作謇非九輦切文二折搴拔取也南楚語從手寒別作搴􅠡並非甗甑也從瓦鬳一曰山形似甑曰甗別作巘非魚蹇切卷膝曲也從卩折居轉切別作捲為舒捲之捲非棬音巨員切訓氣勢也筱箭屬小竹也從竹攸別作篠非先杳切熬也從鬲芻別作炒並非尺沼切擾煩也從手夒別作擾非而沼切文二折繞纏也從糸堯別作繞非􅗸物折落上下相付也一曰餓死曰􅗸從爪又別作殍􅣻莩並非平小切上衣也折從衣從毛古者衣裘折以毛為一曰明也識也隸作表彼小切交灼木也從火教省别作非古巧切咬齧也從齒交別作咬非古巧切皓白貌從頁景別作皓非胡老切文二折昦春天也從日夰別作昊非袌褱也從衣包薄保切別作抱非掃棄也從土帚別作掃非穌老切文二折嫂兄妻也從女叟別作嫂非䢅也從曰在甲上隸作早子浩切文二折棗從重朿別作折從兩耒非手捶也從手􅔧別作搗非都皓切斗櫟實也一曰象斗子從草早自保切俗以為草木之草別作皂字為黑色之皂案櫟實可染帛為黑色故通用為草棧字俗書皂從白從十或從白從七皆無意義無以下筆腦頭折也從匕匕相􅎅箸川象髮囟象腦別作腦非奴皓切文二惱有所恨也從女從腦省別作惱從心非􅚀手也象形臧可切別作左音則箇切奲冨奲奲貌從奢單別作嚲非丁可切果木實也從木象形在木上別作果非古火切楇盛膏器從木從咼別作輠􅬈並非户果切但也從衣􅢓或作裸同別作裸非郎果切寫置物也從宀舄別作㵼非悉也切藏魚也從魚􅐔省別作鮓非側下切市居也從集從􅋄象屋口象築也一曰釋也或作捨別作舍從吉非始野切角也象形別作丱音慣束髮貌義當用􅘲樣栩實也從木羕別作橡樣並非徐兩切仿相似也從人方別作髣非甫兩切文二折放效也逐也從攴方別作倣非邪曲也從木隸作枉俗迂往切之也從彳折音汪隸作往俗羽兩切繦粗纇也從糸強別作鏹非居兩切榜所以輔弓弩從木旁輔盲切又北孟切進船也又北朗切木片也別作榜非慷慨也從心亢別作慷非苦浪切又苦朗切櫎所以几器也從木廣一曰帷屏風之屬別作幌非胡廣切磺銅鐵朴石從石黃古作草作礦礦非古猛切螷陛也修為螷圜為􅛔從蟲庳別作􅪓蠯並非蒲孟切景光也從曰京居影切案影者光景之類也合通用景非毛髮藻飾之事不當從彡文二折竟疆也一曰樂曲盡為竟後人別作境俗又居慶切吉而免凶也從屰從夭隸作幸別作幸並非胡耿切拯上舉也從手升或作撜同別作拯非蒸上聲肯可也從肉折省别作肯非苦等切􅊟大陸山無石者象形別作阜非房九切文二折負恃也從人守貝有所恃也別作負非帚糞也從又持巾掃坰內別作帚非支手切煣屈申木也從火柔別作揉非人九切粈雜飯也從米丑或作同別作糅􅿲並非女九切韭菜名一穜而久者別作韭舉友切歐吐也從欠區別作嘔非蕅芙蕖根也從草水禺別作藕非五厚切畝步百也從田每或作畞同別作𤱔非莫厚切缶瓦器所以盛酒漿秦人鼓之以節歌別作缶非方九切叟老也從又從災或作􅘞同別作叟非穌厚切紞冕冠塞耳也從糸冘別作髧非都感切血醢也從血醓別作醓非他感切􅣿芙蓉􅏞未發為菡􅣿從草閻作蓞非徒感切啖噍啖也從口炎別作噉非徒敢切又作啖音徒監切攬撮持也從手監別作攬非盧敢切粽蘆葉裹米也從米㚇別作粽非作弄切甕罌也從瓦公別作甕非烏貢切蟲食物也從三蟲別作蚛非直衆切又直弓切湩乳汁也從水重別作並非多貢切里中道從􅣑從共皆在邑中所共也或作巷同別作巷非胡絳切佹疲極也從危支別作攰非又去其切佹嶇也戲三軍之偏也從戈䖒別作戲非香義切質至也周書曰大命不質孟子曰出疆必載質從貝從斦或作􅧈同別作贄非脂利切又之日切以物相贅者也文二蓋杠絲也從革旨別作􅶮非諡行之迹也從折言兮皿俗作諡非神至切別作諡音伊昔切又呼狄切􅥂塞上亭守烽火者或作同別作燧非徐醉切抵也從車藝別作輊非陟利切稚幼禾也從禾屖別作稚非直利切蒞臨也從立隸別作蒞非力至切備慎也從人葡別作偹非平祕切文二折滿也從疒折別作非蒔更別種也從草時別作秲並非時吏切司臣司事外者從反后又候望也後人作伺俗別作覗非又息兹切飼糧也從人食或作食同別作飼非祥吏切剕跀也從􅟦非別作剕非扶味切文四折隱也從廠非別作陫並非折臭蟲負蠜也從非蟲或作蜚別作並非折痱風病從疒非別作非又蒲罪切氣雲氣象形或作氣饋客芻米也別作氣非去既切妄怒也從殳折又有決也別作毅非魚既切文二煎茱茰也從草別作藙非榖府也從折肉象形隸作胃從田非云貴切文二蟲似豪豬從省作蝟同隸作彚非從上案下也從􅊂又持火以申繒也別作尉非於胃切巍髙也從嵬委本跨威切今人省山以為魏國之魏虞貴切御使馬也從彳缷或作馭同別作從缶非牛據切燕食也從食芺別作飫非依據切據杖持也從手豦別作據非居遇切助也從力非慮別作勴非良倨切箸飯欹也一曰置也附也從竹者陟慮切又逹倨切又陟略切又直略切又陳如切別作筯著著躇並非處止也得几而止從几夂或作處從虍別作處非昌據切又昌與切豫象之大者不害于物從象豫一曰安也先也後人別作預俗羊茹切文二折􅢟鳥名卑居也從鳥與別作非翥飛舉也從羽者別作翥非章庶切酗醉醟也從酉句別作酗非香遇切諭告也從言俞一曰曉也別作喻非羊戍切赴趨也從走仆省別作訃非芳遇切霚地氣發天不應從雨俗作霧亡遇切􅟦人之足折也在下從止口折即玉切又遵遇切一曰足恭便僻貌別作非注灌也一曰解也釋也從水主作注非之戍切裋豎使布長襦從衣豆別作非常句切孺乳子也一曰輸也從子需別作孑焉正非而遇切莫日且冥也從日在茻中別作暮非莫故切布枲織也從巾父隸作布從􅚀非博故切步行也從止折相背折音撻別作步從少非薄故切白緻繒也從糸􅑰一曰埏土象物也隸作素俗別作塑塑並非桑故切酢醶也從酉乍倉故切今作醋音在各切作起也從人乍別作做非宗祚切又則洛切胙祭福肉也從肉乍別作祚非昨誤切誤謬也從言吳別作悮非五故切文三折忤逆也從午吾別作忤非折遻遇也從辵遻別作忤俉並非又五各切相遇驚也紬微也從糸囟隸作細從田非思計切文二折壻夫也從士胥或從女別作非閉闔門也從門才所以歫門也作閉非博計切蒂瓜當也從草帶別作蒂非都計切暜廢一偏下也從並白或從曰或作替同別作替非他計切文三剃􅚎髮也從髟弟別作剃非折洟鼻液也從水夷今作涕從水弟他禮切泣也弟韋束之次弟也從古字之象作第非特計切沴水不利也從水鬒別作沵非郎計切薊芙也從草魝別作葪非古詣切瘞幽埋也從土㾜別作非於計切之折風亦古諸侯一曰射師從幵別作羿非五計切祭祀也從示以手持肉別作祭祭並非子例切歲木星也越曆二十八宿宣遍隂陽十二月一次從步戌別作歲歲並非相鋭切脆小耎易斷也從肉絶省別作脆非此芮切藝盛力權也一曰種也從坴丮持而種之一曰技能也別作勢藝藝並非始制魚祭二切易卦用蓍也從竹古文巫字隸作筮時制切觢一角卬也從角契省別作掣非尺制切文二折􅪴引縱曰􅪴從手瘛省別作痸非愒息也從心曷別作憩非去例切抴捈也從手世別作拽非折􅞓石之似玉者別作玴非勩勞也從力貰別作並非折􅞥習也從心曳別作怈非餟祭酹也從食叕別作醊非陟衛切睿深明也通也從􅯂從目從谷省或作􅐶同別作非以芮切泰滑從廾從水大古文作夳同别作汰非他蓋切文二大天大地大人亦大象形別作太非又徒蓋切賴贏也從貝剌別作賴賴並非洛帶切文三折癘惡疾從疒蠆省別作癩非折糲粟重一䄷為十六斗大斗半舂為米一斛曰糲別作糲非奈果也從木示別作奈㮈並非奴帶切䟺步行獵跋也從􅟦貝別作狽非博蓋切兌説也從兒公別作兊從公非大外切繼旐之旗沛然而垂從偃從汖別作斾從巾非蒲蓋切妎妒也從女介別作非胡蓋切頭也從糸圭别作罣罫並非畫界也象田四界聿所以畫之別作畫非胡卦切又胡麥切陋也從􅤦折籀文嗌字或作隘同別作厄非烏懈切派別水也從水􅏨別作沠非匹賣切怪異也從心聖別作怪非古壞切􅸬草也姓也從草㕟別作蒯非苦怪切介畫也從八從人俗別作個字書所無不知所從無以下筆明堂左右個者明堂旁室也當作介古拜切文二折屆行不便也一曰極也從尸􅒘􅒘與塊同別作屆從由非薤菜也從韭㕢別作並非胡戒切也從心葡或作同別作􅉵非蒲拜切殺戮也又疾也從殳殺別作閷煞並非所介切話合會善言也從言􅡜籀文從言會別作話從舌者非胡快切墜陊也從石歲徒對切又直類切後人俗作墜􅍟膺無方也從折從口從寸漢文帝以為責對而為言多非誠對故去其口以從士也都隊切却也一曰行過也從彳從曰從夊或作納同隸作退俗他內切輩若軍發車百兩為一輩從車從非別作輩非補妹切佩大帶佩也從人從凡從巾別作珮非補妹切沫灑面也從水未古作須從水頁別作頮並非荒內切文二詯膽氣滿聲從言自別作非􅢚忽也從心介別作恝非呼介切瘥愈也從疒􅐔楚懈切又才他切今以差為非差不相值也黱畫眉也從黑朕別作黛非徒耐切文二折毒瑁也一曰厚也從􅋄從毐別作玳玳並非又徒沃切逮唐逮及也從辵從隸或作逮同別作逯音盧谷切愛惠也從心旡古文作折篆文作愛從既省今作愛從旡訛烏代切薉蕪也從草歲別作穢非於廢切訒頓也一曰識也從言刃別作認非而振切瞚開闔目數搖也從目寅別作瞬非舒閏切晉進也從日臸二至之日隂陽之進也隸作晉俗即刃切㶳火餘也從火聿別作燼非徐刃切文二折賮會禮也從貝㶳別作贐非敶列也從攴陳通用陳字別作陳非直刃切俊材千人也從人夋別作俊非子竣切兵死及牛馬之血為折鬼火也從炎別作磷非良刃切文二吝恨惜也從口文別作吝吝並非齔毁齒也男八月生八歲而齔女七月生七歲而齔從齒七別作齓非初覲切疢熱病也從疒火俗作疹非別作疹籀文疹字音之忍切行示也從彳勻一曰求也順也歸也別作殉徇並非詞閏切憖問也謹敬也從心從猌別作憗非魚覲切又五分切釁血祭也從爨省從酉酉所以祭也從分分布別作釁璺舋並非虗振切又文運切玉器破也韻味也從音員裴光逺云古與均同別作韻非王問切潠含水噴也從水巽別作噀非穌囷切駻馬突也從馬旱別作馯非矦旰切文五折犴胡地野狗也從豸干或作犴別作貋非也折扞快也從手干別作捍非折㪋止也從攴旱別作攼非釬臂鎧也從金干一曰固金藥別作銲非幹築牆專木也從木倝別作幹非古案切濯衣垢也從水折或作浣同別作浣非胡玩切掔手掔也從手臤別作腕碗並非烏貫切判分也從刀半別作拌拚並非普半切文二折泮諸侯鄉射之宮一曰氷釋也從水半別作泮從仌非袒衣縫解也從衣旦別作綻非丈莧切相詐惑也從反豫􅊢作幻胡辦切荐薦折也從草存一曰再也別作洊非才甸切見視也從几從目別作現非古甸切又賢遍切燕玄鳥也象形一曰合語也合飲也別作燕宴宴並非於甸切文二咽嗌也又吞也從口因別作咽非又於前切􅸹行且賣也從行言或作衒別作衒非黃絢切面顔前也從百象形別作靣非彌箭切文二折麵麥末也從麥丏別作麵非淺不深也一曰水激也從水戔別作濺非子賤切又亡衍切遍匝也從彳扁別作遍非比見切劵勞也從力卷省俗作倦同別作惓非渠卷切辨冕也或作覍同別作卞非皮變切文四折拚拊手也從手辨別作抃非折忭喜樂貌從曰辨別作忭非汳水受陳留浚儀隂溝至蒙為雍水東入于泗從水反別作汴非偃僵也一曰障水也從人匽別作堰非於扇切又於幰切問終也從人持弓別作吊非多嘯切蓧草田器也從草條省別作蓧俗徒切人小便也從㞑從水或用溺同別作尿非奴切暴晞也從日出草米別作曝非薄報切冃小兒蠻夷頭衣也從坰從二別作帽非莫報切文二年九十曰折從老蒿省別作耄非噪羣鳥鳴也從品在木上別作噪非穌到切躁疾也從走噪別作躁非則到切盜私利物也從涎皿別作盜從次非文三徒到切翳也所以舞也從羽從別作翢翿纛並非溥覆照也從火壽別作幬非幬正作禪帳也音直由重朱二切閙不靜也從折從鬥別作並非奴教切箇竹枚也從竹固别作個非古賀切馱負物也從馬大別作馱非唐佐切磨石磑也從石靡別作磨非摸卧切正也從土留省土所止也與留同意古人作坐同別作座坐並非徂臥切不均也從糸嬴別作纙非力臥切糯稻名也從禾耎別作糯非奴臥切笮迫也在瓦之下棼上一曰酒簏也別作醡榨並非側駕側格二切蠟蠅瞿也從蟲昔又索也合聚萬物索饗百神也別作䄍從示非鉏駕切文二折慙語也從言作別作非吒噴也叱怒也從口乇別作吒非陟駕切樗木也以其皮裹松脂從木雩或作穫別作樺乎化切文二山在弘農華隂從山􅏞省今俗用華盬也從肉從酉別作醬俗即亮切障隔也從􅊟章別作嶂非之亮切創造法創業也從井創初亮切別作創音楚良切與創同事有不善言折也爾雅薄也別作亮非力讓切鄉國離邑民所封鄉也一曰對也從􅣑㫐別作向北出牖也俗作嚮非許亮切又許良切暀光美也從日往別作旺非于放切況寒水也一曰矧也從水兄別作况非許訪切強語也一曰逐也從競二人隸作競渠慶切徑步道也從彳巠別作徑非居正切冥幽也從日從六冖日數十十六日而月始虧幽也別作暝非莫定切又莫經切寧所願也從用寧省別作寧非乃定切賸物相增加也從貝折一曰送也副也別作剩非石證切又以證切文三折送也從人省別作媵非褱子也從子几几音市朱切別作孕從乃非掕止馬也從手夌別作非里切隥仰也從􅊟登別作嶝磴並非都鄧切懵不明也從心蘿別作懵非武亘切嗅以鼻就臭從鼻從臭別作嗅非許救切㝌貧病也從宀久別作疚非居又切文二折廏馬舍也從廣㲃㲃亦音別作廄從既非舊􅵁舊舊留也從萑臼一曰故也或作鵂同别作舊並非巨救切貁鼠屬善旋從豸穴別作狖非余救切文三折鼬如鼠赤黃而大食鼠者別作非折褎袂也從衣采一曰盛飾貌或作袖同別作褎非又似又切秃實也有實之象下垂從禾几別作秀從乃非息救切文二璓石之次玉者從玉莠作琇非祝祭主贊詞者一曰詛也從示從人從口一曰從兌省別作呪非之秀切又之六切􅍸臞也從疒叟別作瘦非所又切鷇鳥子生哺者從鳥殼別作非口豆切鬥兩士相對兵杖在後象鬥之形或作鬬從鬥斫遇也別作鬪從斗非都豆切槈媷田器也從木辱或從金別作耨非奴豆切叩擊也從攴句苦候切別作扣非扣音苦后切牽馬也濅水名從水折一曰漬也別作浸非子鴆切蔭草隂也從草隂別作廕非於禁切闞望也一曰邑名一曰姓也從門敢古濫切又許濫切獸怒聲別作非暫不久也從日斬別作暫非藏濫切艷好而長也從豐豐大也從盍作艷非以贍切塹坑也從土斬別作塹非七艷切
  hash: sha256:7bf6e737e4243b1d7e8d5b14456b2563532ace810ce8fb5c7d2f457f7b8537c4
