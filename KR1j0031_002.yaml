body:
  text: 復古編序君尊臣卑父坐子立此六經之大閑也大者之學此而已然堯舜稽古之道仲尼時雨之教随噐大小皆使有成則道之有藝之有書小學之所紀亦何可廢㢤然而經天緯地之文不在止戈之後閑邪窒欲之義不假皿蟲而知其覺也晚然後字書小學亦有可觀者焉觀矣而不可泥棄本根而尋枝葉認漚體而舎𬈑渤譬猶壓沙取油用力雖多而終無所淂其所成􅈬者可知也已呉興張謙中習蒃籀行茟圓勁淂李斯陽冰之法校正俗書与古字戾者采摭經傳日考月挍久而不觧元豊中予官方吳興見其用心之初今廿有九年然後成書凡集三千餘字名曰𣸪古編其说以谓專取㑹意者不可以了六書離析偏㫄不可以見全字求古人之心而覔糟粕固以永矣又取一全體鑿為多字情生之说可说可玩而不足以消人之意譬猶入海筭沙無有畔岸運籌役志迷不知改豈特逹如輪扁然後能笑其誤㦲徃揚子雲留意古道用之于玄或笑其自苦或譏其作經然子雲意在賛易非与易竸而劉歆之徒方计目前利害無意扵古覆醬瓿之语足以彂子雲之一笑而己今玄子雲又千有馀歲士守所學而不能忘𣸪古之志者可不谓之難淂也㦲谦中用心于内不務進取一裘一葛專趣内典予方杜门待盡亦讀法界之書嘗闻棗柏之言曰作器者先湏立様造車者當使合轍古無今有即是邪道不可學也予嘗三𣸪此语因思學道之要不以古聖為様轍者皆外逰尓尭舜禹皐陶之所谓稽古者豈特可以為方内之法㢤致逺恐泥尚不可以違轍様而况大學之道乎後之好古者觀俗尚論将有稽于此焉大觀四年十一月叙復寕德郎陳􅗕序
