body:
  text: 復古編序君尊臣卑父坐子立此六經之大間也大者之學此而已然堯舜稽古之道仲尼時雨之教隨器大小皆使有成則道之有藝之有書小學之所紀亦何可廢哉然而經天緯地之文不在止戈之後間邪窒欲之義不假皿蟲而知其覺也晚然後字書小學亦有可觀者焉觀矣而不可泥棄本根而尋枝葉認漚體而舍𬈑渤譬猶壓沙取油用力雖多而終無所淂其所成􅈬者可知也已吳興張謙中習蒃籀行茟圓徑淂李斯陽冰之法校正俗書與古字戾者采托經傳日考月挍久而不解元豐中豫官方吳興見其用心之初今草有九年然後成書凡集三千餘字名曰𣸪古編其説以謂專取會意者不可以了六書離析偏旁不可以見全字求古人之心而覔糟粕固以永矣又取一全體鑿為多字情生之説可説可玩而不足以消人之意譬猶入海算沙無有畔岸運籌役志迷不知改豈特逹如輪扁然後能笑其誤哉往揚子雲留意古道用之于玄或笑其自苦或譏其作經然子雲意在贊易非與易竸而劉歆之徒方計目前利害無意于古覆醬瓿之語足以彂子雲之一笑而己今玄子雲又千有馀歲士守所學而不能忘𣸪古之志者可不謂之難淂也哉謙中用心于內不務進取一裘一葛專趣內典豫方杜門待盡亦讀法界之書嘗聞棗柏之言曰作器者先須立樣造車者當使合轍古無今有即是邪道不可學也豫嘗三𣸪此語因思學道之要不以古聖為樣轍者皆外逰尓堯舜禹皋陶之所謂稽古者豈特可以為方內之法哉致逺恐泥尚不可以違轍樣而况大學之道乎後之好古者觀俗尚論將有稽于此焉大觀四年十一月敘復寧德郎陳􅗕序
