front:
  text: 復古編下吳興張有
  hash: sha256:227b4538acd980667724ba1398d682bf61298b269fdd4324686f533f5f86a782
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0031_SBCK_003-1a}
body:
  text: 入聲聯綿字形聲相類形相類聲相類筆迹小異上正下訛入聲穀續也百榖之總從禾殼別作穀非古祿切簏竹髙篋也從竹鹿或作籙同別作盝非盧谷切文二角獸角也象形漢四皓有角里先生又東方音也別作折觮龣並非又古嶽切穆禾也從禾㣎俗書作莫卜切文二折坶周書武王與紂戰于坶野從土母別作㙁非早敬也從丮夕持事雖夕不休早敬者也別作夙非息逐切蹴躡也迫也從足就後人別作蹙七宿切孰門側堂也從土孰別作非殊六切文三折孰食飪也從丮􅙯別作熟非折玉器也從王􅔧隸作從夀俗肉胾肉也象形隸作肉俗別作宍非而六切文三恧慙也從心而別作忸並非折衄鼻出血也從血丑別作衄從刃非賣也從人折余六切或作同別作音武悲切饘也文二昱明日也從日立別作翌非翌俗書翊字音與職切掬在手曰掬從包米或作攫同別作掬非居六切文二窮理罪人也從幸從人從言從竹或作同別作鞫非酒母也從米折省或作鞠同別作麴非丘六切㰲吹氣也從欠或別作𠸹非於六切叔豆也象形別作菽非式竹切􅫑溉灌也從水芺別作沃非烏鵠切督察也一曰目痛從目叔別作非冬毒切屬連也從尾蜀一曰託辭也別作屬囑並非之欲切蜀葵中蠶也從蟲象形別作蠋非殊玉切蓐陳草復生也從草辱一曰蔟也別作非而切􅰲嘉穀實也從􅓒從米籀文作別作粟非相玉切欲貪也從欠谷別作欲非余蜀切局促從口在尺下復局之人無涯者唯口故口在尺下為局別作局並非渠録切王石之美者有五德象三王之連丨其貫也陽冰曰三畫正均如貫王也隸作玉加點俗魚欲切又欣救息逐相足三切別作玉並非確礊也從石角或作同別作確非胡角切促迫也從人足別作齪非七玉切溢器滿也一曰米二十四分廾之一也一曰二十四兩為溢從水益別作鎰非弋質切率捕鳥畢也象絲罔上下其竿柄也別作卛繂並非所律切文三帥佩巾也從巾從􅎧或作􅍤同別作非􅢊悉􅢊也從蟲帥別作蟀非畢田罔也從􅻎象形別作罼非卑吉切文七折蹕止行也從走蹕別作蹕非折滭風寒也從仌畢別作䬛非折韠韍也所以蔽前以韋從韋畢別作鞸並非珌佩刀下飾天子以玉從玉必別作㻫非篳藩落也從竹畢春秋曰篳門圭竇別作篳非羌人所吹角屠折以驚馬從角別作觱非漆水名從水漆別作㭍柒並非戚悉切膝脛頭卩也從卩漆別作膝非息七切匹四丈也從八匚別作匹非普吉切苾馨香也從草苾或作飶別作馝非毗必切􅱶輔也重也從弜西或作折古作弼並同隸作弼從百非房密切挃穫禾也從手至別作秷非陟栗切姪兄弟之女也從女至別作姪非直質切栗木也其實下垂故從􅓒隸作栗俗一曰懼也別作栗非力質切恤憂也從血卩一曰鮮鮮少也別作恤從邑非辛律切卒隸人給事者衣十為卒臧沒切或作死也子聿切又作踤蒼踤也蒼沒切以卒字三音又別作卆並非市上古衣蔽前而巳象連之形或作韍同別作紱非分勿切文二紼亂系也從系弗別作綍非熚折也從上折古悖字別作非勿切鬱木叢生者從林鬱省別作鬱非迂弗切戉斧也從戈從折王伐切別作鉞音呼會切車鑾聲也伐擊也從人持戈又耒廣五寸為伐一曰伐閲自序也別作垡墢閥並非房越切文三折橃海中大船也從木發別作筏非折瞂盾也從盾犮別作􅚛非襪足衣也從韋蔑別作襪並非望發切郣海地從邑孛一曰地之起曰郣別作渤非蒲沒切公及士搢也籀文作折象形佩也古佩之後人加笏呼骨切渴欲飲也從欠渴今用渴非苦葛切文二折渴盡也從水曷又渠列切今用竭非竭負舉也􅤁伐木餘也從木獻或作蘖古作不同別作枿非五葛切瀎拭滅貌一曰塗也從蔑水別作抹非莫逹切文二秣馬食榖也從食末別作秣非水流聲從水􅡜或作同隸作活非户括切疏也從門折隸作闊非苦括切貀獸無前足從豸出作豽非女滑切鉢器盂屬從折皿或作鉢同別作非北末切文二鮁鱣鮪鮁鮁從魚犮別作鱍非手持隹失之也從又從奎別作奪並非徒活切秸禾稿去其皮祭天以為席從禾皆別作秸非古黠切蠽小蟬蜩也從䖵􅎒爾雅蠽蜻蜻別作􅘪非子列切札牒也從木隱別作扎非別八切屑動作切切也從尸䏌別作屑從肖非先結切文二僁聲也從人別作非竊盜自中出也從穴從米卨草皆聲別作並非千結切鐵黑金也從金􅨖或作折鐵並同別作鐵非他結切文二飻貪也從食殄省隸作餮不省敜塞也從攴念別作揑非乃結切又奴叶切潔麻一專也從糸㓞一曰清也或作潔俗別作潔非古屑切器破也從缶􅒙省別作缺缺並非傾雪切􅒙流行也從水叏別作決從非古穴切文四折觼環之有舌者從角敻或作鐍別作觖非折玉佩也從玉叏別作璚與瓊字同折潏出也一曰水中坻人所為為潏從水矞別作非焆焆煙貌從火肙別作非因恱切泄除去也從水枼別作泄泄並非私列切泄音余制切水名也文四紲系也從糸世春秋傳曰臣負羈紲或作緤同別作絏非折禼蟲也從􅚵象形古作同別作非薛草也從草辥別作薛非又桑葛切作亦非洌水清也從水列別作冽從仌非良辥切蠥衣服歌謠草木之怪謂之祅禽獸蟲蝗之怪謂之蠥從蟲辥別作非魚列切文二折􅮙議罪也從水獻別作讞非雪凝雨説物者從雨彗隸作雪俗相絶切蕝朝會束茅表位曰蕝從草絶作蕞非孑説切絶斷絲也從糸從刀從卩古作反繼為絶別作絶從色非情雪切舄鵲也象形或作鵲同別作鵲非七雀切禮器也象形中有鬯酒又持之也所以飮器象者取其鳴節節足足也隸作爵即略切勺挹取也象形之若切又市若切今俗以杓為杯杓之杓非杓甫遙切斗柄也又都歷切射的也別作的非通用的字斫也從石箸別作櫡並非張略切玃母猴也從犬矍爾雅玃父善顧別作蠼非俱縳切屩履也從履省從喬別作橇非居勺切殘也從虍虎足反爪人也隸作虐俗魚約切籆收絲者也從竹蒦或作同別作籰非王縛切愙敬也從心客別作恪非苦各切咢譁訟從吅屰別作噩咢並非五各切文六折遻相遇驚也從辵咢別作愕遌並非又五故切折鄂江夏縣從邑咢一曰華跗也別作萼非折似蜥易長一丈水潛吞人即浮出日南從蟲屰別作鱷非折刀劍刃也從咢別作鍔非折􅧭鷙也從鳥屰又與專切別作鶚鳶並非彉弩滿也從弓黃別作彍擴並非苦郭切惡過也從心亞別作惡非烏各切醋客酌主人也從酉昔在各切俗作倉故切非文二鑿穿木也從金別作鑿非貈似狐善睡獸從豸舟下各切別作貉音莫白切豸種也椁葬有木椁也從木􅴹別作槨非古博切貉北方豸種從豸各別作貊從百非莫白切洦淺水也從水百別作泊從白非匹白切非乙虢切􅧞入家􅊧也從宀索所責切今用索音蘇各切草有莖葉可作繩索也從􅜨糸郤邑名從邑谷別作却非綺戟切文二粗葛也從糸夻別作絺巾綌並非有枝兵也從戈倝別作戟從卓非紀逆切劇尤甚也從刀豦別作劇非渠力切血理分邪行體者從􅏨血後人或從􅏨肉作脈別作脈非莫獲切求也從貝朿一曰負也側革切又側賣切別作債非嘖大呼也從口責或從言別作頥從臣非士革切厄隘也從户乙於革切別作厄五果切厄扼呝之類皆當從厄脊背吕也從肉折別作脊非資昔切文四折􅠧魚名從魚脊別作鯽非鯽音昨則切與烏鰂字同折膌瘦也從肉脊別作瘠非折蹐小步也從足從脊別作蹐非斥卻屋也從廣屰別作厈非厈古文廠字也昌石切炙炮肉也從肉在火上之石切又之夜切別作非䄷稻百二十斤也從禾石今别用石碩並非常隻切擲搔也從手適一曰投也別作擲非直隻切亦人之臂亦也從大象兩亦之形或作掖臂下也別作腋非羊益切狊犬視貌俗折別作闃靜靜也從門狊非古義當只用狊字古闃切又苦狊切釋解也從釆從睪一曰説也別作懌非賞職切又羊益切析破木也一曰折也從木斤別作析非先激切􅓦無人聲也從宀叔或作同別作寂並非前歷切覛邪視也一曰求也從􅏨見別作覔從不非莫狄切文二冖覆也從一下垂別作非的明也從日勺別作的從白非都歷切文四折芍從草勺蓮其中也別作菂非又胡了切鳬茈也又時灼切藥名也又七略切陂名在宋折適親也從辵啇別作嫡雖同音訓孎也又施隻切之也別作從女非折滴水注也從水啻別作從水適非歷過也從止曆一曰象也別作曆從日後人所加郎擊切鶂鳥也從鳥兒或作鷊同別作鷁艗非五歷切職記微也從耳戠別作職非之弋切飾刷也從巾人食別作餝拭並非賞職切敗創也從蟲人食別作蝕非乘力切日在西方時側也從日仄別作非阻力切敕誡也臿地曰敕恥力切世以勑為敕字行之已久勑洛代切滿也從心折一曰十萬也別作憶非於力切文二安也從人啻別作億從意非或邦也從口戈以守一一地也又作域同于逼切別作胡國切以為疑或不定之意無復域音文三折水流也從川或別作彧非折羊裘之縫從黑或作緎非􅻘以火乾肉從火稫省別作􅟺煏並非符逼切蟘蟲食苗葉者從蟲貸別作非徒得切默犬暫逐人也一曰靜也別作默非莫北切文二索也從糸黑別作纆非敗也從戈則別作賊從戎非昨則切文二折鰂烏鰂魚名從魚則或作鯽同別作鱡非充肩也象形又能勝此物謂之充別作剋非苦得切歰不滑也從四止或作澀同別作澀非色立切靸小兒履也從革及別作非穌合切畗滿也從高省象高厚之形又當也或作答小叔也別作答畣並非德合切又伏堛二音踏踐也從􅟦莫大羽別作踏非徒合切納絲溼納納也從糸內一曰補也入也別作衲非奴答切雜五彩相合從衣集別作雜非昨合切臘冬至後三戌也從肉巤別作蠟鑞非盧合切曄光也從日􅒧隸作曄俗域輒切文二折􅖙盛也從火曄別作燁非極驢上負也從木及別作笈非極曄切腌漬肉也從肉奄別作醃非於葉切睫目旁毛也從目夾別作睫非子葉切文二折楫舟棹也從木咠別作楫非臿舂去麥皮也從臼千所以臿之或作插剌也別作插並非楚洽切文二折疀􅳍也古田器也別作非輒車兩輢也從車耴別作輒從又非陟葉切獵放獵逐禽也從犬巤別作獦非良涉切銸鉆也從金耴別作鑷非尼輒切疊揚雄説以為古理官決罪三日得其宜乃行之從晶宜亡新以為疉三日太盛改為三田一曰厚也懷也別作非徒叶切文四蝶蛺蝶也從蟲疌別作蝶非折􅵄南楚謂襌衣曰􅵄從衣葉別作褋非折城上女垣也從土葉別作堞非燮和也從炎從又折省別作燮非穌叶切文二折屟履中薦也從尸枼別作屧靾􅦘屉並非拹摺也從手劦一曰拉也別作搚非虛業切陜隘也從􅊟夾別作狹峽並非矦夾切士無巾有折或作韐同別作帢巾夾帢並非古洽切文二夾衣無絮也從衣合別作夾非柙檻也以藏虎兕從木甲一曰檢柙也今言文書押署是也別作押廫從廣膠洛蕭切霩從雨郭苦郭切別作寥廓非一從壷吉於悉切一從壷凶於云切吉凶在壷中不得泄也別作氤氲又作絪緼並非消搖猶翶翔也消從水肖相邀切搖從手䍃余招切別作逍遙字林所加􅐔沱失時也􅐔從􅑰左七何切沱從水它徒何切別作蹉跎非箸猶豫也折從心折直由切箸從竹者陳如切別作躊非佹嶇佹從危支去其切嶇從􅊟區豈俱切作﨑嶇非匝周遍也折從包舟職流切匝從倒之子答切別作周匝非峙躇不前也峙從止從寺直離切躇從足從屠直魚切別作踟蹰非鬪連結相牽也折從鬥從賓省匹賓切從鬥從燹撫文切別作􅌭紛非坳垤地不平也坳從土幼於交切垤從土至徒結切別作凹凸非􅥳阢危也徐巡以為凶也賈侍中説􅥳法度也班固説不安也􅥳從􅊟從毁省五結切阢從􅊟兀五忽切別作危臬非恍忽狂之貌從心況省許往切忽忘也從心勿呼骨切別作恍惚非阿那垂貌阿從􅊟可烏可切那從邑冉奴可切別作妸折從女非蹢躅住足也蹢從足適省直隻切躅從足蜀直録切別作躑躅非坎坷陷也坎從土欠苦感切坷從土可康我切別作轗軻非軻車屬玓瓅明珠也玓從王勺都歷切瓅從玉樂郎擊切別作的皪非琲瓃始華琲也從王非普乃切瓃從王靁省魯回切別作蓓蕾非絓折网也又綰也從网古眩切絓繭縡頭也從糸圭胡卦切別作罥非丁寧願詞也丁從入丨當經切寧從丂寧奴丁切別作叮寧非屯亶難行不進貌屯象草初生屯然而難引株倫切亶從廩旦張連切別作迍邅非囁吺多言也囁從言聶之涉切吺從口投省汝俱切又當矦切別作囁嚅非迹折車迹也從車從省即容切迹步處也從辵亦資昔切別作蹤迹非儋何即負何也儋從人詹都甘切何從人可胡我切別作擔荷非髫齔髫小兒垂髻也從髟召徒聊切齔毁齒也從齒非空從穴工苦紅切矦從人廠象布矢於其下乎溝切虙虧古帝號虙虎貌從虍必房六切虧氣損也從亏雐虛宜切別作伏犧非虧或用羲同昆侖山名昆從日比古渾切侖從集册力屯切別用崑崙非目宿草名漢書罽賓國多目宿苑馬所嗜目眼也莫六切宿止也從宀息逐切別作苜蓿非族絫小腫病一曰痤也族從偃矢昨木切絫從厽糸力軌切別作瘯非車渠尓雅大貝如車渠即魧屬也車尺遮切渠強魚苡草名折從草啻於力切苡從草以羊止切別作薏苡音意以非枇杷木也枇從木比房脂切杷從木巴蒲巴切一曰胡樂胡人馬上所鼓別作琵琶非虴蜢草上蟲也一曰船名虴從蟲乇陟格切蜢從蟲孟莫杏切別作舴艋非詹諸折鼀也其鳴詹諸詹從言八厃職廉切諸從言者章魚切別作蟾蜍非螌蝥毒蟲也螌從蟲般布還切蝥從蟲蝥莫交切別用班貓非即令雍􅖥也即從皀卩子席切令從集卩力丁切別作鶺鴒非卑居楚鳥也一曰鸒秦曰雅卑從丆甲音匹居從尸古九魚切別作鵯鶋並非溪􅠃水鳥也溪從谷奚苦兮切􅠃從鳥式恥力切別作非蛧折山川之精物也淮南王説狀如三歲小兒赤黑色赤目長耳美髮蛧從蟲网文兩切從蟲兩良獎切別作魍魎非卯蟺龍貌卯從夕卩於阮又於元㓛蟺從蟲亶常演又以然切別作蜿蜒非解豸獸也似山牛一角古者決訟令觸不直象形解佳買切豸宅買切别作獬非橐他案史記丐奴竒畜也槖從㯻省石他各切他從人它徒何切今作駱駝非㞒鼇也一曰雌鼇折壯大也從三大三目平祕切㞒從尸自虛器切又許介切臥息也別作贔屭非蘆蔔似蕪菁實如小叔根似薺苨蘆從草盧洛乎切蔔從草服蒲北切別作蘿蔔非本草或作萊蔔不能行為人所引也從尢爪是都兮切從爪尢巂户圭切今俗用提攜二字加沙梵言加沙此言不正色加從力口古牙切沙從水少所加切葛洪字苑別作袈裟非形聲相類並職容切鍾從金重酒器鐘從金童樂也秋分之音並工户切鼓從壴􅠭春分之音郭也萬物郭皮甲而朝君也望從亡望省出亡于外望其還也並治小切肇從戈㡽戟屬肇從攴肇省擊也並之忍切􅷾從几彡新生羽而飛也鬒從人彡稠髮也與鬒同並食鄰切晨從日辰或作曟房星為民田時者䢅從辰臼早昧爽也並户經切刑從刀幵徑也㓝從刀井罰罪也易曰井法也並户經切郉從邑幵周公所封地從邑井鄭地並奴丁切寧安也從宀心在皿上寧從丂寧願詞也並先稽切屖從尸辛遲也犀從牛尾南徼外牛也並息流切修從彡攸飾也修從肉攸脯也並於喬切􅯾從女芙巧也一曰女子笑貌祅從示芺反物為祅並紀庸切龏從折龍慤也龔從共龍給也並側詞切􅤓象缶形災從川田不耕田也或作災同並戶乖切褱從衣鬼袖也一曰藏也褱從衣眔俠也並弋支切移從木多棠隸也移從禾多相倚移也並巨良切強從弓疆弓有力也強從蟲弘蚚也並烏代切愛從心從旡惠也從夊愛行貌並於求切􅡣從心頁愁也憂從攴􅡣和之行也並直由切折從口折又誰也從白詞也並似茲切辭從辛受不受也辭從辛􅜆訟也並盧紅切櫳從木龍檻也櫳房室之疏也並徂紅切叢從丵取聚也藂從草叢草藂生貌並麌俱切從心禺㥥懼也愚戅也並古雙切杠從木工牀前橫木也扛從手工橫關對舉也並無非切折從人攴專省妙也微從彳隱行也並諸盈切延從廴正行也征從彳正正行也或作延並如鄰切人天地之性最貴者也象臂脛之形兒仁人也在人下故詰屈並杜兮切折從見是顯也題從頁是額也並側加切柤從木且木間也抯從手且挹也並所交切梢從木肖木杪也捎從手肖捎也並九魚切凥處也從尸得几而止居蹲也從尸古與踞同並必郢切屛從尸並庰從廣並蔽也音訓同並呼鳥切曉從日從堯明也皢從白堯日之白也並古亥切改從攴己更也從攴己㱾巳大剛卯以逐鬼魅也並直吕切杼機之持緯者柔栩也並從木豫並九輦切𧽐從走蹇省蹇從􅟦寒省跛也俗作謇非並余隴切折從走甬喪辟也踊從足甬跳也並丑郢切折從辵呈通也徎從彳從呈徑行也並之隴切踵從止折重跟也踵從足重追也一曰往來貌並當古切睹從目者與覩同暏從日者旦明也並良獎切兩再也兩從一兩二十四銖也並徂朗切折從犬壯妄強大也奘從大大音他逹切從壯駔大也並居竦切並從手共拱斂手也拲兩手同械也並古雅切徦從彳假至也假從人假非真也並其呂切秬折或從禾黑黍也一稃二米以釀也匱從木巨木也並求癸切揆從手癸葵也楑從木癸木也一曰度也並盧瞰切濫從水監泛也一曰濡上及下也一曰清也㜮從女監過差也並實照切邵從卩召髙也邵從邑召晉邑並魚怨切折從頁折顛頂也願從頁原大頭也並子之切茲從二玄黑也兹從草茲省草木益多也人隹廠鴈鵝也從鳥雁省並穌旰切㪔分離也從攴林林分㪔之意雜肉也從肉㪔並他弔切䊮穀也從米翟糶出榖也從出䊮並皮命切寎臥驚也從夢省丙病疾加也從丙並莫故切從心莫慔勉也習也並烏諫切晏天清也從日安妟安也從女日並薄報切曓從日出疾有所趣也暴從日出米晞也並胡頰切協從劦心同心之和協從劦十衆之同和十衆也並苦化切折從足荂踞也跨從足夸渡也並蒲莧切辨判也從刀辡辦致力也從力辡並苦浪切抗扞也從手亢或從木同杭俗作胡郎切並丈莧切䋎補縫也從糸旦袒衣縫解也從衣旦並博陌切佰相什佰也從人百伯長也從人白並羊益切奕圍棊也從廾亦奕大也從大亦他逹切並北角切駁馬角不純也從馬爻駮獸如馬食虎豹從馬交並賞隻切釋從釆睪解也釋從米睪漬米也並所劣切刷拭也從又巾尸刷刮也從刀刷省並筠輒切曄從日􅒧光也從白􅒧草木白􅒧也並穌叶切折從又持炎辛大孰也燮和也從言又炎並居月切厥發石也從廠欮瘚逆氣也從疒屰欠並子葉切椄從木妾續木也接從手接交也並古祿切榖從木殼楮也穀從禾殼續也百穀總名並式竹切折從􅟦疾也從犬走也並盧答切柆從木立折木也拉從手立摧也並以灼切躍從走從翟踊也躍從􅟦翟迅也並私列切辥從辛罪也薜從草草也並魚欠切醶從酉僉酢漿也鹼從鹵僉鹵也並職深切針從竹咸綴衣針也葴從草咸馬藍也並陟教切折從网隹覆鳥令不飛走也罩從网卓捕魚器也並子力切稷從禾畟齋也五榖之長㮨從木畟細理木也並良涉切鬣鬣同折或從毛巤或從豕巤擸從手巤持也並匹妙切勡從力票劫也剽從刀票砭剌也並迂勿切折芳草也十葉為貫百貫築而煮之為從􅍫冖缶鬯彡共飾也一曰鬯百草之華逺方人所貢芳草合釀之以降神鬱今鬱林郡也鬱木叢生者從林省並烏皎切折從宀㫐户樞聲屋之東南隅也䆞從穴皀冥也並苦骨切折從土折兔也堀從土省突也並魯甘切籃大篝也從竹監藍染青草也從草監並香依切晞乾也從日稀省睎望也從目稀省並力鹽切簾堂簾也從竹廉薕蒹也從草廉並以灼切籥書僮竹笘也從竹􅕛蘥爵麥也從草􅕛並亡沼切杪木標末也從木少秒禾􅉭也從禾少並胡官切萑鴟屬從隹􅯉􅍉也從草萑並息移切澌水索也從水斯澌流仌也從仌斯形相類種從禾重直容切先種後孰穜從禾童之用切藝也從􅝟由以周切木生條也甹從由丂普丁切亟詞謠從言肉徒歌也余招切從缶肉瓦器以周切扉從户非甫微切户扇也屝從尸非扶沸切履也佰從人百博陌切相什佰也古文夙字夾從大挾二人古狎切持也夾從大二入失冉切盜竊褱物也毛眉髮及獸毛也象形莫袍切手拳也象形書九切戻從户大徒蓋切輜車旁推户也戾從犬出户下郎計切曲也􅜨普活切草木盛􅜨􅜨然象形八聲􅜨從屮八匹刃切分枲莖皮也戊中宫象相拘絞也莫候切戉從戈王伐切斧也䏌從肉八許訖切振䏌也肖從肉小私妙切骨肉相似也母莫后切牧也象褱子乳子形母武扶切止之也從女有姦之者㫐從口上烏皎切望逺合也皂象嘉穀在裹中形􅎅以扱之皮及切又音香從宀㫐烏皎切户樞聲也冟從冖皀施隻切飯剛柔不相著也暜從日並滂古切日無色也暜從並白他計切一偏下也宙從宀由直又切舟輿所覆極也籀文岫字從臼屰匹各切臿從臼千楚洽切舂去麥皮也舀從爪臼以沼切杼臼也或作㧒同臽從人在臼上户􅰉切小阱也晶從三日子盈切精光也皛從三白烏皎切顯也汨羅水名從水日莫狄切汩從水曰于筆切治水也褎從衣采似又切袂也或作袖褎從衣博毛切衣博裾􅽯足上象腓腸下從止所菹切􅟦人之􅟦也在下從止口即玉切宷從宀釆式荏切悉也知宷諦也寀從宀采倉宰切同地為宷居從尸古九魚切蹲也㕆從古廠矦古切美石也林從二折􅜨匹卦切葩之總名林從二木力尋切野外也云古雲字王分切折從倒子他骨切不順忽出也宭從宀君渠云切羣居也窘從穴君渠隕切迫也弓草木之華未發象形乎感切卪瑞信也子結切卯從夕卩於阮切轉卧也肥從肉卩符非切多肉也覆也從网音烏感切罵也從网言力智切朿七賜切木􅉭也束書玉切轉也從木口刺從刀朿七賜切直傷也刺從刀束盧逹切戾也從攴朿楚革切擊馬也從攴束恥力切誡也今用勑栝從木舌他念切炊竈木也桰從木􅡜古活切櫽也號呼也從號虎乎刀切土鍪也從䖒號胡到切執從丮㚔之入切折捕罪人也從手省居六切撮也醫從匚矢於計切盛弓弩矢器􅔆古簠字二而至切地之數也二古上字肺從肉􅜨芳吠切金藏也胏從肉阻史切食所遺也或作柿從木􅜨芳吠切削木札朴也􅏄從木鉏里切赤實果也砥從廠氐職雉切礪石也砥同底從廣氐都禮切山居也蚩從蟲之赤之切蟲也蚩從蟲􅋄丑善切蟲曳行也殳從又几市朱切以殳殊人也從又在回下莫勃切入水有所取也古回字亘從二折須緣切求亘也從二舟古字古鄧切嵒從山品五咸切山巖巖從品相連多言也尼輒切圮從土己符鄙切毁也圯從土巳與之切橋也苗從草田武鑣切草生於田者笛從草由徒歷他六二切蓨也卉從三屮許偉切草之總名也卉三十筓也穌沓切氣象形去既切雲氣也于從反彳母玉切步止也少從小丿書沼切不多也尐從小乀子結切少也公從折八某古紅切平分也公從兒口以轉切山間陷也叱從口七昌栗切訶也吒從口乇陟駕切噴也凵張口也象形口犯切某去魚切飯器也以柳木為之象形彳丑亦切小步也象人脛三屬相連也廴從彳引之長行也余忍切延從㢟丿長行也以然切延從廴正諸盈切行也㢟從廴止丑連切安步也􅿻從彳止斯氏切與徙也從干二二古上字去虔切罪也從一息鄰切秋時也又于救切手也象形父從義舉杖扶雨切矩也叉從又象手指相錯形初牙切叉從又象叉形側絞切手足甲也象器也大口切酒器也亞象人背局之形衣駕切醜也卯象開門之形莫飽切冒也丣古酉字象閉門之形從止屮又乂手也疾葉切疾也從止又入尼輒切機下足所履也乙於筆切甲乙字􆂌烏轄切玄鳥也從反丨􅹣月切鉤識也某古肱字丿右戾也房密切象左引之形􅛣明也余制切象抴引形􅡊象隱蔽形於謹切匿也乀左戾也分勿切從反丿從反􅛣弋支切折義移流水也􅗵古及字丨古本切上下通也􅖱姑泫切小流也乂從丿乀魚廢切芟也五古五字夨從大折象形阻力切傾頭也夭從大象形於兆切屈也甶象形敷勿切鬼頭也田象四口阡陌之制待年切丰象形草生散亂也古拜切從生上下逹草盛也敷容切􅴺從兮丿象上越揚之形戶吳切平從丂八八分也符兵切語平舒也從力折渠卷切勞也倦同從刀去願切契也肉胾肉象形如六切月魚厥切大隂之精象形㲋丑略切獸青色似兔而大頭似兔足似鹿兔湯故切象踞後其尾形頭似㲋巂周燕也從隹􅋄訥户圭切雋肥肉也從弓以射隹也徂流切袍從衣包薄褒切襺也袌從衣包薄保切褱也舠從舟刀五忽切船行不安也古服字箑從竹疌山洽切扇也或作箑萐從草疌七洽切萐蒲瑞草也扇暑而涼從本卉呼骨切疾也奏則候切從本廾屮屮上進之義從水折子禮切沇也沛從水􅜨普蓋切水名檢從木僉居奄切書也撿從手僉良冉切拱也救從手求舉朱切盛土於梩中也毬從毛求巨鳩切鞠丸也氐從氏下箸一丁禮切至也木本從氏大於末居月切甘從口含一古三切美也下古丹字顫也從疒又于救切疛腹病也從疒肘省陟柳切􅘲象形工瓦切芉角也別作丱非草古猛切古文磺從疒芉似陽切瘍也從芉爿則郎切牡芉也美從芉大無鄙切甘也美從芉照省古牢切芉子也涕從水弟他禮切泣也洟從水夷他計切鼻液也米象形莫禮切禾實也采蒲莧切象獸爪分別也采從爪木倉宰切捋取也􅣴從爪禾徐醉切禾成秀從􅛣之省以灼切岸上見也屵從山􅛣五葛切岸髙也去從大某丘折據切人相違也谷從口大象其理其虐切白從入合二旁陌切西方色也疾二切與自字同從心刀魚既切怒也忍從心刃而軫切能也陝從􅊟㚒失冉切弘農陜也陜從􅊟夾矦夾切隘也俗作峽非猒從甘折於鹽折切飽也厭從廠猒於輒一淡二切笮也從衣㠭知扇切丹縠衣展從尸省知衍切轉也㘣從囗肙似沿切規也圓從囗員王問切圜全也弓以近窮逺象形居戎切下古及字百從一白博陌切十十也西從谷他念切舌貌旬從包日詳遵切十日也眴從目勻省黃絢切目搖蔔從折草服蒲北切蘆蔔也箙從竹服房六切弩矢箙也􅹈從丌甶必至切付與也􅹈從廾甶渠既切舉也目人眼象形莫六切下古良字困從囗木苦悶切故廬囷從囗禾去倫切廪之圜者拜博怪切揚雄説從兩手下拜居竦切揚雄説從兩手彔象形盧谷切下古魅字溼從水一土顯省失入切幽溼也濕從水顯他合切水名萑從草隹職追切草多貌萑從隹􅘲胡官切鴟屬有毛角􅜪從坰一莫保切重覆也冃從坰二莫報切頭衣也廠山石之崖人可居象形呼旱切廣因廣以為屋象形魚儉切從又持巾尼輒切手疌巧聿從一余律切所以書也最從坰取才句切積也最從冃取祖外切犯而取也臭從犬自尺救切臊也狊從犬目古闃切犬視也糸象形莫狄切細絲五忽系從糸丿胡計切繫也􅥽從子爻古肴切放也孝從老省子呼教切善事父母者晳從白析先擊切人白色也晢從日折旨熱切昭哲明也媱從女䍃曲肩行貌折余招切淫從女㸒私逸也餘針切兀從一在人上五忽切髙而上平也尢從大象偏曲形烏光切跛曲脛也豐從豆象豆之滿者也敷戎切豐從豆象形盧啓切行禮之器杗從木亡武方切棟也􅳒古文困字摩從手麻莫鄱切研也從手靡許為切旌旗指癸象水從四方流入地中之形居誄切下古文共字從貝折余六切衒也賣從出買莫邂切出貨物也商從訥章省式陽切從內知外也啻從口帝施智切語時不啻也從重八兵列切分也兆古文治小切從心折於力切滿也意從心音於記􅋀志也􅑰是為切草木華折葉􅑰也象形古懷切背呂也象形習從羽白似入切數飛也下古友字上古手字下古堯字墜從土隊直類切陊也下古地字稿從木高苦浩切枯也藳從禾髙古老切禾稈也愆愆上從言㑆胡禮切待也下籀文愆從言侃上古仁字下古夷字匚受物之器象形府良切匚從上有一覆之邪傒有所俠藏也胡禮切從乃西省如乘切驚聲或曰往也從乃􅓒氣行貌以周切替從白兓七感切曾折也替從曰兟他計切廢一偏下也從之土草木妄折生也户光切從省從土古封字籀文折不省府容切瘍從疒昜與章切頭創也痬從疒易羊益切脈痬也晚莫也從日免無逺切睌大目視貌從目免武限切古文折字下古文孟字務趣也從力敄亡遇切㡔從巾敄髹布也莫卜切士事也數始於一終於十推十合一鉏禮切土地中物出形它魯切盻恨視也從目兮胡計切盼美目也從目分匹莧切萁豆莖也從草其渠之切箕簸也從竹其居之切脽折也示隹切從肉隹􅷥髀也徒魂切或從肉隼袓事也從衣且才與切袒衣縫解也從衣旦丈萈切䁂大目也從目折臤矦簡切短深目也從目𥄗烏括切筲飯器也從竹捎所交切飯筥也從竹稍山樞切冕大夫以上冠也從冃免亡辨切冤屈也從免在坰下不得走於袁切筋肉之力也從力肉竹居銀切腱筋之本也從筋卯省渠建切從􅛣異胥里切石利也廙從廣異與職切行屋也壑從折谷溝也呼各切或從土睿從目谷省以芮切深明也或從土𩏇從韋假乎加切履也𩏇從韋段徒玩切履後帖也渜從水耎乃管切湯也濡從水需人朱切縱從系從緩也足用切緃從糸從省䋐也足容切亅鉤逆者謂之亅衢月切鉤識也從反亅居月切丂氣欲舒出折上礙於一也苦浩切虎何切反丂也禾木之曲頭止不能上也古兮切禾從木􅑰省户戈切嘉榖也上髙也時掌切下底也胡雅切正從止一之盛切是也乏房法切反正以為之止象草木出有址故從止為􅟦諸市切從反止他逹切爪覆手曰爪象形側狡切丮也從反爪諸兩切亦丮也丮象手有所丮據也几劇切持也從反丮居玉切持也又象形手也于救切􅚀手也象形臧可切卩象相合之形子結切瑞信也卩也側候切印從爪卩於刃切執政所持信也按也從反印於棘切后象人之形繼體君也胡口切司從反后臣司事於外者息茲切欠象氣從人上出之形去劒切從反欠飮食氣屰不得息曰居未切永長也象形于憬切折􅏨從反永水之邪流別也匹卦切首頭也象形書九切斷首倒縣古堯切之象草過屮枝莖益大者所之一者地也止而切匝從反之而匝也子答切胡辦切子象形古文作子即里切云不順忽出也從到子古文作㐬他骨切變也從到人呼跨切古文殄從反人天地之性最貴者也如鄰切􅎅相與比敘也從反人卑履切可肯也從口折肯我切叵不可也從反可普火切古文王字古文玉字上王雨方切中畫近上王者則天之義中王魚欲切三畫正均如貫王也下壬如林切位北方也象人褱妊之形上草倉老切百卉也從二屮中居竦切竦手也從折又下􅦁暜班切引也從反上丈直兩切十尺也從又持十中􅠭土刀切滑也從又􅋄下支章移切從又持半竹上取七庾切捕也從又耳中而涉切使也從攴耴省下耴陟葉切耳垂也象形上折胡耿切吉而免凶也從屰夭中㚔尼輒切所以驚人也從大􅥷下古南字上折敷容切忤也從夂中夆乎蓋切相遮要害也從夊丰下降下江切服也從跨相承不敢並上折即里切止也從盛而一橫止之中市分勿切韠也象形下市時止切從坰􅗵之省買賣所之上冖莫狄切覆也從一下垂也中坰古熒切林外也下几居履切踞几也象形上干古寒切犯也從到入從一中如審切㨖也從干入一下屰魚戟切不順也從干下凵上久舉友切象人兩脛後有距也中夂陟侈切象人兩脛後有致之者下夊楚危切象人兩脛有所屣也上大徒蓋切象人形中大他逹切大也下六力竹切易之數從入八上臼居玉切義手也從瓜中臼其九切象形下古齒字上䑣丑林切又以中切船行也又祭名中彤徒冬切丹飾也從丹彡下古丹字上折如延切從犬肉中醓他感切肉汁滓也從肉冘下疣羽求切贅也從肉尤上段徒玩切推物也從殳專省中假古雅切借也下亦假字談長説假如此上黕都感切滓垢也從黑冘中默莫北切從犬黑下古疣字上諡神至切行之迹也從言盆中諡伊昔呼狄二切笑貌從言益下謐彌必切靜語從言從上折芉朱切束縛捽抴為從中折余制切折也從丿下􅿼古蕢字上耹巨今切國語回祿信於耹從耳今中聆郎丁切聽也從耳令下郎丁切甕似瓶從瓦令上滔土刀切水大貌從水舀中淹胡感切泥水淹淹也從水臽下涵胡男切水澤多也從水函上鈹敷羈切大針也一曰劒如刀􅏻者從金皮中煆乎加切錏煆也從金假下鍛丁貫切小冶也從金段上㣇芉至切修豪獸從彑下象毛足中彖通貫切豕走也從彑從豕省下彖式視切豕也從彑豕上折户關切馬一歲也從馬一絆其足中折之戍切從馬二絆其足下􅎗陟立切從馬口其足絆馬也上從疾容切相聽也從二人中比毗至切密也從反從下北博墨切也從二人相背上否方九切不也從口不中咅天口切相與語唾而不受也從亅否下㫘美畢切不見也從日否省上敲從攴髙橫擲也口交切中毃從殳高擊頭也口卓切下歊從欠髙歊歊氣出貌許嬌切上驅古文驅中毆烏后切從殳區捶擊物也下歐亦烏后切吐也從欠區上災側詞切缶器也中息進切古囟字下凷從土一屈苦對切凷與塊同上岊陬隅高山之節從山卩子結切中屺山無草木也從山已墟里切下古文扈從山􅝟上企舉踵也從人止去智切中仚人在山上呼堅切下丐氣也從亡人古代切聲相類並五換切玩弄也從王元或從貝玩習厭也從習元並子浩切璪王飾如藻之文從王噪璅石之似玉者從王巢並力求切瑬垂玉也冕飾從玉流石之有光璧也從玉丣並五關切環璧也從王瞏鍰鋝也從金爰並胡果切禍害也神不福也從示咼屰惡驚詞從旡咼並去既切氣雲氣也象形氣饋客芻米也從米氣並徒活切折手持隹失之從奎又􅴠強取也從攴兌並側狡切爪手足甲也從又象形爪丮也覆手曰爪象形並諸兩切掌手中也從手尚丮持也從反爪象形並普伯切霸月始生霸也從月䨣魄隂神也從鬼白並康禮切啓開也從户口啓教也從攴啓並疾正切淨又士耕切魯北城門池從水爭瀞無垢薉也從水靜並徒紅切童奴也從䇂重省僮未冠也從人童並他得切忒更也從心弋失常也從心代並徒朗切蕩水名從水􅛅潒漾水動搖也從水象並苦昆切折無髮也從頁困鬄髮也從髟兒並康狠切齧也狠從豕艮齦從齒艮訓同並郎豆切屚屋穿水下也從尸雨漏以銅受水刻節百刻從水屚並烏紺切暗閉門也從門音暗日無光也從日音並五溉切閡門外閉也從門亥礙止也從石疑並粗臥切折斬芻也從草銼折傷也從刀並子小切勦勞也從力巢絶也從刀噪並魚折切屰不順也從干下凵屰之逆迎也從辵屰並兵列切折分也重八相倚別分解也又憑列切從冎刀並徐醉切歲從意也從八豕遂亡也從辵歲並七感切憯痛也從心朁毒也從心並側鳩切鄒魯縣古邾國顓帝之後所封從邑芻郰魯下邑孔子之鄉也從邑取並愚袁切邍從辵備録闕髙平之野人所登原水泉並慈衍切㣤迹也從彳戔踐履也從􅟦戔並古雅切假非真也從人從假假借也並古懷切折戾也從􅘲兆背呂也象形並徒弄切同通街也從行同洞水疾流也從水同並楚八切察言微親察也從言察省察覆也從宀祭並昌真切謓恚也從言真瞋張目也從目真並職緣切叀從么省屮小謹也專從寸叀六寸簿也並山洽切翜捷也飛之疾也從羽夾翣棺羽飾也從羽妾並昨千切􅋊賊也從歹戔禽獸所食餘也從歹肉並力珍切麟牝麒也從鹿吝麟大牝鹿也從鹿粦並穌困切顨折易卦為折長女為風者從丌巽具也從丌並許嬌切哮豕驚也從口孝虓師子鳴從虎九並薄折報切暴疾有所趣也從日出草本􅕝虐也急也從虎武並式陽切折行買也從貝商省商以外知內也從冏章省並於今切􅙨雲覆日從雲今隂暗也水之南山之北也從􅊟侌並將鄰切折氣液也從血􅩎水渡也從水􅩎並冬毒切䈞厚也從竹享篤馬行頓也從竹馬並於力切檍杶也從木意梓屬也從木並側詵切折果實小如栗從木辛榛木也從木秦並於六切郁地名從邑有有文章也從有並薄回切􅘌河東聞喜縣從邑非裴裴回寬衣貌從衣非並語期切折未定也從古文矢字疑惑也從子止矢並矦閣切合合口也從口集匌匝也從包合並親吉切漆木汁可髹物象形漆水名從水漆並治小切肁始開也從户聿擊也從攴肁並他案切歎吟也從欠堇嘆吞歎也一曰大息也從口堇並普魂切噴吹氣也從欠賁噴吒也鼓鼻也從口賁並陟交切啁嘐也從口周嘲謔也通用啁字從口朝並失廉切苫蓋也從草占喪藉也從草侵並郎段切亂治也從隱􅜆􅴛煩也從攴􅜆並都昆切折厚也從心􅙯怒也又詆也從攴􅙯並奴代切能忍也從肉足似鹿耐罪不至也從而寸或作奈同並穌對切􅷢破也從瓦卒碎磨也從石卒並徒古切􅩹閉也從攴度杜甘棠也從木土並杜回切頽禿貌從禿貴下隊也從􅊟貴並古黠切折刮也又畫堅也從叏戞也從戈􅔣並居許切􅞠飲牛筐也從竹豦筥筲也從竹呂並補各切簙局戲也從竹博博大通也從十􅌹並先代切簺行棊相簺也從竹塞塞隔也從土並奴歷切溺沒也從水人溺水名從水弱並子禮切泲沇也從水濟水名從水齊並章俱切朱赤心木松柏屬也從木一在其中絑純赤從糸朱並去隓切窺閃也從門規窺小視從穴規並力軌切壘絫墼也從土厽壘軍壁也從土畾並兵折切啚嗇也從口廩鄙五酇為鄙從邑啚並多朗切攩朋群也從手黨黨不鮮也從黑尚並莫卜切牧養牛人也從攴牛坶坶野也周書武王與紂戰于坶野從土母並力軌切誄諡也從言耒讄禱也纍功德以求福從言纍省或作並側加切樝果似梨而酢從木虘柤木間也從木且並吉蚪切朻髙木也從木丩樛下句曰樛從木翏並徒朗切折放也從心象惕亦放也從心易又平也並匹交切脬膀胱也從肉孚胞兒生裹也從肉包並苦叶切愜悏心也從心篋㤲思貌從心夾並盧含切貪也訓同婪從女林婪從心林並黃絢切眩目無常主也從目玄眴目搖也從目旬或作眴同並烏媧切䖯蠆從蟲圭蛙蝦蟇也從黽圭俗作蛙非並力卧切䇔痿也從立􅢓䌴不均也從糸䇔等字皆當從䇔乃得聲説文並從羸恐訛並五口切耦耒廣五寸為伐二伐為耦從耒禺偶桐人也從人禺並苦故切胯股也從肉夸褲脛衣也從糸夸作袴非並徐呂切敘次第也從攴余序東西牆也從廣豫並他含切貪從貝今欲物也欿從欠臽欲得也並毗祭切上㡀敗衣也從巾象形中敝同一曰帗也從攴㡀下弊頓仆從犬敝並似嗟切上邪也從衣牙中邪又以遮切琅琊郡名從邑牙下斜杼也從斗余並是為切上􅑰草木葉􅑰也中垂逺􅡽也從土􅑰下小口罌從缶􅑰並許斤切上欣闓也從心斤中欣笑喜也從欠斤下欣喜也從言斤並古弚折切上噭吼也從口折敫二叫呼也從口丩三髙聲也一曰大呼從並孚梵切上泛浮也從水中泛濫也從水已下泛浮貌從水凡並薄經切上蓱萍也從草洴中萍蘋也從水萍下蘋蓱也從草平符兵切無根浮水生者並居六切上蘜治牆也從草鞠中菊曰精似秋華從草􅯅省下菊蘧麥從草掬並子肖切上醮冠娶禮祭從酉焦中釂飲酒盡也從酉嚼省下潐盡也從水焦並户吳切上糊寄食也從食胡中黏也從黍古下饘也從􅦧古並以成切上嬴少昊氏之姓從女􅢓中贏有餘賈利也從貝􅢓徐鉉曰當從嬴省乃得聲瀛水名從水嬴並郎果切上􅢓或曰嘼名象形中螺蜾螺蒲盧細腰土蜂也中從蟲􅢓下袒也從衣􅢓與裸同也從人支下妓婦人小物也從女從支筆迹小異八博拔切折辵丑略切彳丑亦切折廴余忍切行户庚切折牙五加切入人汁切折畗芳逼切復房六切折者之也切月魚厥切折􅝟乎感切齊徂兮切折年奴顛切疒女疙切折人如鄰切匕呼跨切折老盧皓切舟職流切折俞芉朱切欠去劒切折旡居未切頁胡結切折駕古訝切文無分切折卯去京切永于憬切折谷古祿切魚語居切折􅍫居玉切户矦古切折門莫奔切也芉者切折氏承旨切建居萬切折所疏舉切久舉友切折我五可切乍鉏駕切折蟲許偉切可肯我切折即子力切既居未切折力林直切昔思積切折九舉有切子即里切折亥胡改切上正下訛天他前切折毒徒沃切走子茍切折步薄故切乏房法切折章諸良切殳市朱切折以周切羽王矩切折鳥都了切焉有虔切折畢卑吉切爭側莖切折􅊟房九切耒盧對切折乃奴亥切舍始夜切折偃於幰切甬余隴切折録盧谷切西呼訝切折戎而中切衆之仲切折交古爻切老盧浩切折石常隻切而如之切折吳五乎切亢古郎切折囟息進切云王分切折非甫微切烏代切折俞羊朱切丐古代切折甚常枕切
