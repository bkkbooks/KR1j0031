front:
  text: 復古編下吳興張有
  hash: sha256:227b4538acd980667724ba1398d682bf61298b269fdd4324686f533f5f86a782
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0031_SBCK_003-1a}
body:
  text: 入聲聯緜字形聲相類形相類聲相類筆迹小異上正下譌入聲穀續也百榖之總从禾㱿別作糓非古禄切簏竹髙篋也从竹鹿或作箓同別作盝非盧谷切文二角獸角也象形漢四顥有角里先生又東方音也別作折觮龣竝非又古岳切穆禾也从禾㣎俗書作莫卜切文二折坶周書武王與紂戰于坶野从土母別作㙁非早敬也从丮夕持事雖夕不休早敬者也別作夙非息逐切蹴躡也迫也从足就後人別作蹙七宿切塾門側堂也从土孰別作非殊六切文三折孰食飪也从丮􅙯別作熟非折玉器也从王􅔧隷作从夀俗肉胾肉也象形隷作肉俗別作宍非而六切文三恧慙也从心而別作忸並非折衄鼻出血也从血丑別作衂从刃非賣也从人折余六切或作同別作音武悲切䭈也文二昱明日也从日立別作翌非翌俗書翊字音與職切匊在手曰匊从勹米或作㩴同別作掬非居六切文二窮理罪人也从幸从人从言从竹或作同別作鞫非酒母也从米折省或作鞠同別作麴非丘六切㰲吹气也从欠或別作㖪非於六切尗豆也象形別作菽非式竹切􅫑漑灌也从水芺別作沃非烏鵠切督察也一曰目痛从目叔別作非冬毒切屬連也从尾蜀一曰託辭也別作属囑並非之欲切蜀葵中蠶也从虫象形別作蠋非殊玉切蓐陳艸復生也从艸辱一曰蔟也別作非而切􅰲嘉穀實也从􅓒从米籀文作別作粟非相玉切欲貪也从欠谷別作慾非余蜀切局促从口在尺下復局之人無涯者唯口故口在尺下爲局別作跼並非渠録切王石之美者有五德象三王之連丨其貫也陽冰曰三畫正均如貫王也隷作玉加點俗魚欲切又欣救息逐相足三切別作玉並非确礊也从石角或作同別作確非胡角切促迫也从人足別作齪非七玉切溢器滿也一曰米二十四分廾之一也一曰二十四兩爲溢从水益別作鎰非弋質切率捕鳥畢也象絲罔上下其竿柄也別作卛繂並非所律切文三帥佩巾也从巾从􅎧或作􅍤同別作非􅢊悉􅢊也从虫帥別作蟀非畢田罔也从􅻎象形別作罼非卑吉切文七折䟆止行也从走䟆別作蹕非折㓖風寒也从仌畢別作䬛非折韠韍也所以蔽前以韋从韋畢別作鞸並非珌佩刀下飾天子以玉从玉必別作㻫非篳藩落也从竹畢春秋曰篳門圭竇別作篳非羌人所吹角屠折以驚馬从角別作觱非漆水名从水桼別作㭍柒竝非戚悉切厀脛頭卩也从卩桼別作膝非息七切匹四丈也从八匚別作疋非普吉切苾馨香也从草苾或作飶別作馝非毗必切􅱶輔也重也从弜㐁或作折古作㢸竝同隷作弼从百非房宻切挃穫禾也从手至別作秷非陟栗切姪兄弟之女也从女至別作妷非直質切㮚木也其實下垂故从􅓒隷作栗俗一曰懼也別作慄非力質切卹憂也从血卩一曰鮮鮮少也別作䘏从邑非辛律切卒隷人給事者衣十爲卒臧没切或作死也子聿切又作踤蒼踤也蒼没切以卒字三音又別作卆並非市上古衣蔽前而巳象連之形或作韍同別作紱非分勿切文二紼亂系也从系弗別作綍非熚折也从上折古悖字別作非勿切鬱木叢生者从林鬱省別作欝非迂弗切戉斧也从戈从折王伐切別作鉞音呼㑹切車鑾聲也伐擊也从人持戈又耒廣五寸爲伐一曰伐閲自序也別作垡墢閥並非房越切文三折橃海中大船也从木發別作筏非折瞂盾也从盾犮別作􅚛非韤足衣也从韋蔑別作韈竝非望發切郣海地从邑孛一曰地之起曰郣別作渤非蒲没切公及士搢也籀文作折象形佩也古佩之後人加笏呼骨切㵣欲㱃也从欠渴今用渴非苦葛切文二折渴盡也从水曷又渠列切今用竭非竭負舉也􅤁伐木餘也从木獻或作蘖古作不同別作枿非五葛切瀎拭滅皃一曰塗也从蔑水別作抹非莫逹切文二䬴馬食榖也从食末別作秣非水流聲从水􅡜或作同隷作活非户括切䟽也从門折隷作闊非苦括切貀獸無前足从豸出作豽非女滑切盋器盂屬从折皿或作鉢同別作非北末切文二鮁鱣鮪鮁鮁从魚犮別作鱍非手持隹失之也从又从奞別作奪並非徒活切稭禾稾去其皮祭天以爲席从禾皆別作䕸非古黠切蠽小蟬蜩也从䖵􅎒爾雅蠽蜻蜻別作􅘪非子列切札牒也从木乚別作扎非別八切㞕動作切切也从尸䏌別作屑从肖非先結切文二僁聲也从人別作非竊盜自中出也从穴从米卨廿皆聲別作並非千結切鐵黑金也从金􅨖或作折銕竝同別作䥫非他結切文二飻貪也从食殄省隷作餮不省敜塞也从攴念別作揑非乃結切又奴叶切絜麻一耑也从糸㓞一曰清也或作潔俗別作㓗非古㞕切器破也从缶􅒙省別作缺缺竝非傾雪切􅒙流行也从水叏別作决从非古穴切文四折觼環之有舌者从角夐或作鐍別作觖非折玉佩也从玉叏別作璚與瓊字同折潏出也一曰水中坻人所爲爲潏从水矞別作非焆焆煙皃从火肙別作非因恱切渫除去也从水枼別作泄洩竝非私列切泄音余制切水名也文四紲系也从糸世春秋傳曰臣負羈紲或作緤同別作絏非折禼蟲也从􅚵象形古作同別作非薛艸也从艸辥別作薛非又桑葛切作亦非洌水清也从水列別作冽从仌非良辥切蠥衣服歌䚻草木之怪謂之䄏禽獸蟲蝗之怪謂之蠥从虫辥別作非魚列切文二折􅮙議辠也从水獻別作讞非䨮凝雨說物者从雨彗隷作雪俗相絕切蕝朝㑹束茅表位曰蕝从艸絕作蕞非孑說切絕斷絲也从糸从刀从卩古作反㡭爲絶別作絶从色非情雪切舄䧿也象形或作䧿同別作鵲非七雀切禮器也象形中有鬯酒又持之也所以飮器象者取其鳴節節足足也隷作爵即略切勺挹取也象形之若切又市若切今俗以杓爲桮杓之杓非杓甫遥切斗柄也又都歷切射的也別作㢩非通用的字斫也从石箸別作櫡並非張略切玃母猴也从犬矍爾雅玃父善顧別作蠼非俱縳切屩履也从履省从喬別作鞽非居勺切殘也从虍虎足反爪人也隷作虐俗魚約切籆收絲者也从竹蒦或作同別作籰非王縛切愙敬也从心客別作恪非苦各切㖾譁訟从吅屰別作噩咢並非五各切文六折遻相遇驚也从辵㖾別作㦍遌並非又五故切折䣞江夏縣从邑㖾一曰華跗也別作萼非折似蜥易長一丈水潛吞人即浮出日南从虫屰別作鱷非折刀劍刃也从㖾別作鍔非折􅧭鷙也从鳥屰又與專切別作鶚鳶並非彉弩滿也从弓黄別作彍擴並非苦郭切惡過也从心亞別作惡非烏各切醋客酌主人也从酉昔在各切俗作倉故切非文二鑿穿木也从金別作鑿非貈似狐善睡獸从豸舟下各切別作貉音莫白切豸種也椁葬有木椁也从木􅴹別作槨非古博切貉北方豸種从豸各別作貊从百非莫白切洦淺水也从水百別作泊从白非匹白切非乙虢切􅧞入家􅊧也从宀索所責切今用索音蘇各切艸有莖葉可作繩索也从􅜨糸郤邑名从邑谷別作㕁非綺㦸切文二粗葛也从糸夻別作絺巾綌並非有枝兵也从戈倝別作㦸从卓非紀逆切劇尤甚也从刀豦別作劇非渠力切血理分衺行體者从􅏨血後人或从􅏨肉作脈別作脉非莫獲切求也从貝朿一曰負也側革切又側賣切別作債非嘖大呼也从口責或从言別作頥从臣非士革切戹隘也从户乙於革切別作厄五果切阸㧖呝之類皆當从戹脊背吕也从肉折別作脊非資昔切文四折􅠧魚名从魚脊別作鯽非鯽音昨則切與烏鰂字同折膌痩也从肉脊別作瘠非折蹐小歩也从足从脊別作蹐非㡿卻屋也从广屰別作厈非厈古文厂字也昌石切炙炮肉也从肉在火上之石切又之夜切別作非䄷稻百二十斤也从禾石今别用石碩並非常隻切擿搔也从手適一曰投也別作擲非直隻切亦人之臂亦也从大象兩亦之形或作掖臂下也別作腋非羊益切狊犬視皃俗折別作闃靜靜也从門狊非古義當只用狊字古闃切又苦狊切釋解也从釆从睪一曰説也別作懌非賞職切又羊益切析破木也一曰折也从木斤別作㭊非先激切􅓦無人聲也从宀尗或作同別作寂竝非前歷切覛衺視也一曰求也从􅏨見別作覔从不非莫狄切文二冖覆也从一下垂別作非旳明也从日勺別作的从白非都歷切文四折芍从艸勺蓮其中也別作菂非又胡了切鳬茈也又時灼切藥名也又七略切陂名在宋折適親也从辵啇別作嫡雖同音訓孎也又施隻切之也別作从女非折滴水注也从水啻別作从水適非歷過也从止厤一曰象也別作曆从日後人所加郎擊切鶃鳥也从鳥兒或作鷊同別作鷁艗非五歷切職記微也从耳戠別作軄非之弋切飾㕞也从巾人食別作餝拭竝非賞職切敗創也从虫人食別作蝕非乗力切日在西方時側也从日仄別作非阻力切敕誡也臿地曰敕恥力切世以勑爲敕字行之已久勑洛代切滿也从心折一曰十萬也別作憶非於力切文二安也从人啻別作億从意非或邦也从口戈以守一一地也又作域同于逼切別作胡國切以爲疑或不定之意無復域音文三折水流也从川或別作彧非折羊裘之縫从黑或作緎非􅻘以火乾肉从火稫省別作􅟺煏並非符逼切蟘蟲食苗葉者从虫貸別作非徒得切默犬暫逐人也一曰靜也別作嘿非莫北切文二索也从糸黒別作纆非敗也从戈則別作賊从戎非昨則切文二折鰂烏鰂魚名从魚則或作鯽同別作鱡非充肩也象形又能勝此物謂之充別作剋非苦得切歰不滑也从四止或作濇同別作澁非色立切靸小兒履也从革及別作非穌合切畗滿也从高省象高厚之形又當也或作荅小尗也別作答畣並非德合切又伏堛二音蹋踐也从􅟦莫大羽別作踏非徒合切納絲溼納納也从糸内一曰補也入也別作衲非奴荅切雜五彩相合从衣集別作雜非昨合切臘冬至後三戌也从肉巤別作蠟鑞非盧合切曄光也从日􅒧隷作曄俗域輒切文二折􅖙盛也从火曄別作燁非极驢上負也从木及別作笈非極曄切腌漬肉也从肉奄別作醃非於葉切䀹目旁毛也从目夾別作睫非子葉切文二折楫舟櫂也从木咠別作檝非臿舂去麥皮也从臼千所以臿之或作插剌也別作揷竝非楚洽切文二折疀􅳍也古田器也別作非輒車兩輢也从車耴別作輙从又非陟葉切獵放獵逐禽也从犬巤別作獦非良渉切銸鉆也从金耴別作鑷非尼輒切㬪揚雄説以爲古理官決罪三日得其宐乃行之从晶宐亡新以爲疉三日太盛改爲三田一曰厚也懷也別作非徒叶切文四蜨蛺蜨也从虫疌別作蝶非折􅵄南楚謂襌衣曰􅵄从衣葉別作褋非折城上女垣也从土葉別作堞非燮和也从炎从又折省別作爕非穌叶切文二折屟履中薦也从尸枼別作屧靾􅦘屉竝非拹摺也从手劦一曰拉也別作搚非虚業切陜隘也从􅊟夾別作狹峽竝非矦夾切士無巾有折或作韐同別作帢巾夾㡊並非古洽切文二袷衣無絮也从衣合別作裌非柙檻也以藏虎兕从木甲一曰檢柙也今言文書押署是也別作押廫从广膠洛蕭切霩从雨郭苦郭切別作寥廓非壹从壷吉於悉切㚃从壷凶於云切吉凶在壷中不得渫也別作氤氲又作絪緼並非消搖猶翶翔也消从水肖相邀切搖从手䍃余招切別作逍遙字林所加􅐔沱失時也􅐔从􅑰左七何切沱从水它徒何切別作蹉跎非箸猶豫也折从心折直由切箸从竹者陳如切別作躊非㩻䧢㩻从危支去其切䧢从􅊟區豈俱切作﨑嶇非帀周徧也折从勹舟職流切帀从倒之子荅切別作週迊非峙䠧不前也峙从止从寺直离切䠧从足从屠直魚切別作踟蹰非闘連結相牽也折从鬥从賓省匹賓切从鬥从燹撫文切別作􅌭紛非坳垤地不平也坳从土幼於交切垤从土至徒結切別作凹凸非􅥳阢危也徐廵以爲凶也賈侍中説􅥳法度也班固説不安也􅥳从􅊟从毁省五結切阢从􅊟兀五忽切別作危臬非怳忽狂之皃从心況省許徃切忽忘也从心勿呼骨切別作恍惚非阿那垂皃阿从􅊟可烏可切那从邑冉奴可切別作妸折从女非蹢躅住足也蹢从足適省直隻切躅从足蜀直録切別作躑䠱非坎坷陷也坎从土欠苦感切坷从土可康我切別作轗軻非軻車屬玓瓅明珠也玓从王勺都歷切瓅从玉樂郎擊切別作的皪非琲瓃始華琲也从王非普乃切瓃从王靁省鲁回切別作蓓蕾非絓折网也又綰也从网古眩切絓繭縡頭也从糸圭胡卦切別作罥非丁寧願詞也丁从入丨當經切寧从丂寍奴丁切別作叮寧非屯亶難行不進皃屯象艸初生屯然而難引株倫切亶从㐭旦張連切別作迍邅非讘吺多言也讘从言聶之渉切吺从口投省汝俱切又當矦切別作囁嚅非迹折車迹也从車從省即容切迹歩處也从辵亦資昔切別作蹤跡非儋何即負何也儋从人詹都甘切何从人可胡我切別作擔荷非髫齔髫小兒垂髻也从髟召徒聊切齔毁齒也从齒非空从穴工苦紅切矦从人厂象布矢於其下乎溝切虙虧古帝號虙虎皃从虍必房六切虧氣損也从亏雐虚宐切別作伏犧非虧或用羲同昆侖山名昆从日比古渾切侖从亼冊力屯切別用崑崙非目宿艸名漢書罽賓國多目宿苑馬所嗜目眼也莫六切宿止也从宀息逐切別作苜蓿非族絫小腫病一曰痤也族从㫃矢昨木切絫从厽糸力軌切別作瘯非車渠尓雅大貝如車渠即魧屬也車尺遮切渠强魚苢艸名折从艸啻於力切苢从艸㠯羊止切別作薏苡音意以非枇杷木也枇从木比房脂切杷从木巴蒲巴切一曰胡樂胡人馬上所鼓別作琵琶非虴蜢艸上蟲也一曰船名虴从虫乇陟格切蜢从虫孟莫杏切別作舴艋非詹諸折鼀也其鳴詹諸詹从言八厃職廉切諸从言者章魚切別作蟾蜍非螌蝥毒蟲也螌从虫般布還切蝥从虫蝥莫交切別用班猫非即令雝􅖥也即从皀卩子席切令从亼卩力丁切別作鶺鴒非卑居楚鳥也一曰鸒秦曰雅卑从丆甲音匹居从尸古九魚切別作鵯鶋並非谿􅠃水鳥也谿从谷奚苦兮切􅠃从鳥式恥力切別作非蛧折山川之精物也淮南王說狀如三歲小兒赤黑色赤目長耳美髪蛧从虫网文两切从虫两良獎切別作䰣魉非夗蟺龍皃夗从夕卩於阮又於元㓛蟺从虫亶常演又以然切別作蜿蜒非解廌獸也似山牛一角古者決訟令觸不直象形解佳買切廌宅買切别作獬非橐佗案史記匃奴竒畜也槖从㯻省石他各切佗从人它徒何切今作駱駝非㞒鼇也一曰雌鼇折壯大也从三大三目平祕切㞒从尸自虚器切又許介切臥息也別作贔屭非蘆菔似蕪菁實如小尗根似薺苨蘆从艸盧洛乎切菔从艸服蒲北切別作蘿蔔非本艸或作萊菔不能行爲人所引也从尣爪是都兮切从爪尣巂户圭切今俗用提攜二字加沙梵言加沙此言不正色加从力口古牙切沙从水少所加切葛洪字苑別作袈裟非形聲相類竝職容切鍾从金重酒器鐘从金童樂也秋分之音竝工户切鼓从壴􅠭春分之音郭也萬物郭皮甲而朝君也望从亾朢省出亾于外望其還也竝治小切肇从戈㡽戟屬肇从攴肈省擊也竝之忍切􅷾从几彡新生羽而飛也㐱从人彡稠髮也與鬒同竝食鄰切晨从日辰或作曟房星爲民田時者䢅从辰臼早昧爽也竝户經切刑从刀幵勁也㓝从刀丼罰辠也易曰丼法也竝户經切郉从邑幵周公所封地从邑井鄭地竝奴丁切寧安也从宀心在皿上寧从丂寜願詞也竝先稽切屖从尸辛遟也犀从牛尾南徼外牛也竝息流切修从彡攸飾也脩从肉攸脯也竝於喬切􅯾从女芙巧也一曰女子笑皃䄏从示芺反物爲䄏竝紀庸切龏从折龍慤也龔从共龍給也竝側詞切􅤓象缶形甾从巛田不耕田也或作菑同竝戸乖切褢从衣鬼袖也一曰藏也褱从衣眔俠也竝弋支切移从木多棠隶也移从禾多相倚移也竝巨良切彊从弓畺弓有力也強从虫弘蚚也竝烏代切㤅从心从旡惠也从夊㤅行皃竝於求切􅡣从心頁愁也憂从攵􅡣和之行也竝直由切折从口折又誰也从白詞也竝似茲切辤从辛受不受也辭从辛􅜆訟也竝盧紅切櫳从木龍檻也㰍房室之䟽也竝徂紅切叢从丵取聚也䕺从艸叢艸䕺生皃竝麌俱切从心禺㥥懼也愚戅也竝古雙切杠从木工牀前横木也扛从手工横關對舉也竝無非切折从人攴耑省妙也微从彳隱行也竝諸盈切延从廴正行也征从彳正正行也或作延竝如鄰切人天地之性最貴者也象臂脛之形儿仁人也在人下故詰屈竝杜兮切折从見昰顯也題从頁昰額也竝側加切柤从木且木閑也抯从手且挹也竝所交切梢从木肖木杪也捎从手肖捎也竝九魚切凥處也从尸得几而止居蹲也从尸古與踞同竝必郢切屛从尸幷庰从广幷蔽也音訓同竝呼鳥切曉从日从堯明也皢从白堯日之白也竝古亥切改从攴己更也从攴己㱾巳大剛卯以逐鬼魅也竝直吕切杼機之持緯者柔栩也竝从木予竝九輦切䞿从走蹇省蹇从􅟦寒省跛也俗作謇非竝余隴切折从走甬䘮辟也踊从足甬跳也竝丑郢切折从辵呈通也徎从彳从呈徑行也竝之隴切歱从止折重跟也踵从足重追也一曰徃来皃竝當古切睹从目者與覩同暏從日者旦明也竝良獎切㒳再也兩从一㒳二十四銖也竝徂朗切折从犬壯妄彊大也奘从大大音他逹切从壯駔大也竝居竦切竝从手共拱歛手也拲兩手同械也竝古雅切徦从彳叚至也假从人叚非真也竝其呂切秬折或从禾黑黍也一稃二米以釀也柜从木巨木也竝求癸切揆从手癸葵也楑从木癸木也一曰度也竝盧瞰切濫从水監氾也一曰濡上及下也一曰清也㜮从女監過差也竝寔照切邵从卩召髙也邵从邑召晉邑竝魚怨切折从頁折顛頂也願从頁原大頭也竝子之切玆从二玄黑也兹从艸玆省艸木益多也人隹厂鴈鵝也从鳥雁省竝穌旰切㪔分離也从攴林林分㪔之意雜肉也从肉㪔竝他弔切䊮穀也从米翟糶出榖也从出䊮竝皮命切寎臥驚也从㝱省丙病疾加也从丙竝莫故切从心莫慔勉也習也竝烏諫切晏天清也从日安妟安也从女日竝薄報切曓从日出疾有所趣也㬥从日出米晞也竝胡頰切恊从劦心同心之和恊从劦十衆之同和十衆也竝苦化切折从足荂踞也跨从足夸渡也竝蒲莧切辨判也从刀辡辦致力也从力辡竝苦浪切抗扞也从手亢或从木同杭俗作胡郎切竝丈莧切䋎補縫也从糸旦袒衣縫解也从衣旦竝博陌切佰相什佰也从人百伯長也从人白竝羊益切弈圍棊也从廾亦奕大也从大亦他逹切竝北角切駁馬角不純也从馬爻駮獸如馬食虎豹从馬交竝賞隻切釋从釆睪解也釋从米睪漬米也竝所劣切㕞拭也从又巾尸刷刮也从刀㕞省竝筠輒切曄从日􅒧光也从白􅒧艸木白􅒧也竝穌叶切折从又持炎辛大孰也燮和也从言又炎竝居月切厥發石也从厂欮瘚逆气也从疒屰欠並子葉切椄从木妾續木也接从手接交也竝古禄切榖从木㱿楮也穀从禾㱿續也百穀緫名竝式竹切折从􅟦疾也从犬走也竝盧荅切柆从木立折木也拉从手立摧也竝以灼切趯从走从翟踊也躍从􅟦翟迅也竝私列切辥从辛辠也薜从艸艸也竝魚欠切醶从酉僉酢漿也鹼从鹵僉鹵也竝職深切箴从竹咸綴衣箴也葴从艸咸馬藍也竝陟教切折从网隹覆鳥令不飛走也罩从网卓捕魚器也竝子力切稷从禾畟齋也五榖之長㮨从木畟細理木也竝良渉切㲱鬣同折或从毛巤或从豕巤擸从手巤持也竝匹妙切勡从力票劫也剽从刀票砭剌也竝迂勿切折芳艸也十葉爲貫百貫築而煑之爲从􅍫冖缶鬯彡共飾也一曰鬯百艸之華逺方人所貢芳艸合釀之以降神鬱今鬱林郡也鬱木叢生者从林省竝烏皎切折从宀㫐户樞聲屋之東南隅也䆞从穴皀㝠也竝苦骨切折从土折兎也堀从土省突也竝魯甘切籃大篝也从竹監藍染青艸也从艸監竝香依切晞乾也从日稀省睎望也从目稀省竝力鹽切簾堂簾也从竹廉薕蒹也从艸廉竝以灼切籥書僮竹笘也从竹􅕛蘥爵麥也从艸􅕛竝亡沼切杪木標末也从木少秒禾􅉭也从禾少竝胡官切萑鴟屬从隹􅯉􅍉也从艸萑竝息移切澌水索也从水斯凘流仌也从仌斯形相類種从禾重直容切先種後孰穜从禾童之用切蓺也从􅝟由以周切木生條也甹从由丂普丁切亟詞䚻从言肉徒歌也余招切从缶肉瓦器以周切扉从户非甫微切户扇也屝从尸非扶沸切履也佰从人百博陌切相什佰也古文夙字夾从大挾二人古狎切持也夾从大二入失冉切盜竊褱物也毛眉髮及獸毛也象形莫袍切手拳也象形書九切戻从户大徒蓋切輜車㫄推户也戾从犬出户下郎計切曲也􅜨普活切艸木盛􅜨􅜨然象形八聲􅜨从屮八匹刃切分枲莖皮也戊中宫象相拘絞也莫候切戉从戈王伐切斧也䏌从肉八許訖切振䏌也肖从肉小私妙切骨肉相似也母莫后切牧也象褱子乳子形母武扶切止之也从女有奸之者㫐从口上烏皎切望逺合也皂象嘉穀在裹中形􅎅以扱之皮及切又音香从宀㫐烏皎切户樞聲也冟从冖皀施隻切飯剛柔不相著也暜从日竝滂古切日無色也暜从竝白他計切一偏下也宙从宀由直又切舟輿所覆極也籀文岫字从臼屰匹各切臿从臼千楚洽切舂去麥皮也舀从爫臼以沼切杼臼也或作㧒同臽从人在臼上户􅰉切小阱也晶从三日子盈切精光也皛从三白烏皎切顯也汨羅水名从水日莫狄切汩从水曰于筆切治水也褎从衣采似又切袂也或作袖褎从衣博毛切衣博裾􅽯足上象腓腸下从止所菹切􅟦人之􅟦也在下从止口即玉切宷从宀釆式荏切悉也知宷諦也寀从宀采倉宰切同地爲宷居从尸古九魚切蹲也㕆从古厂矦古切美石也林从二折􅜨匹卦切葩之緫名林从二木力㝷切野外也云古雲字王分切折从倒子他骨切不順忽出也宭从宀君渠云切羣居也窘从穴君渠隕切迫也弓艸木之華未發象形乎感切卪瑞信也子結切夗从夕卩於阮切轉卧也肥从肉卩符非切多肉也覆也从网音烏感切罵也从网言力智切朿七賜切木􅉭也束書玉切轉也从木口刺从刀朿七賜切直傷也刺从刀束盧逹切戾也从攴朿楚革切擊馬也从攴束恥力切誡也今用勑栝从木舌他念切炊竈木也桰从木􅡜古活切櫽也號呼也从号虎乎刀切土鍪也从䖒号胡到切執从丮㚔之入切折捕罪人也从手省居六切撮也医从匚矢於計切盛弓弩矢器􅔆古簠字二而至切地之數也二古上字肺从肉􅜨芳吠切金藏也胏从肉阻史切食所遺也或作柿从木􅜨芳吠切削木札樸也􅏄从木鉏里切赤實果也厎从厂氐職雉切礪石也砥同底从广氐都礼切山居也蚩从虫㞢赤之切蟲也蚩从虫􅋄丑善切蟲曳行也殳从又几市朱切以杸殊人也从又在回下莫勃切入水有所取也古回字亘从二折須縁切求亘也从二舟古字古鄧切嵒从山品五咸切山巖喦从品相連多言也尼輒切圮从土己符鄙切毁也圯从土巳與之切橋也苗从艸田武鑣切艸生於田者笛从艸由徒歷他六二切蓨也芔从三屮許偉切艸之緫名也卉三十筓也穌沓切气象形去旣切雲气也于从反彳母玉切歩止也少从小丿書沼切不多也尐从小乀子結切少也公从折八厶古紅切平分也㕣从儿口以轉切山間陷也叱从口七昌栗切訶也吒从口乇陟駕切噴也凵張口也象形口犯切厶去魚切飯器也以桺木爲之象形彳丑亦切小歩也象人脛三屬相連也廴从彳引之長行也余忍切延从㢟丿長行也以然切延从廴正諸盈切行也㢟从廴止丑連切安歩也􅿻从彳止斯氏切與徙也从干二二古上字去䖍切辠也从一息鄰切秋時也又于救切手也象形父从义舉杖扶雨切矩也叉从又象手指相錯形初牙切叉从又象叉形側絞切手足甲也象器也大口切酒器也亞象人背局之形衣駕切醜也夘象開門之形莫飽切冐也丣古酉字象閉門之形从止屮又乂手也疾葉切疾也从止又入尼輒切機下足所履也乙於筆切甲乙字􆂌烏轄切玄鳥也从反丨􅹣月切鉤識也厶古肱字丿右戾也房宻切象左引之形􅛣明也余制切象抴引形􅡊象隱蔽形於謹切匿也乀左戾也分勿切从反丿从反􅛣弋支切折義移流水也􅗵古及字丨古本切上下通也􅖱姑泫切小流也乂从丿乀魚廢切芟也㐅古五字夨从大折象形阻力切傾頭也夭从大象形於兆切屈也甶象形敷勿切鬼頭也田象四口阡陌之制待年切丰象形艸生散亂也古拜切从生上下逹艸盛也敷容切􅴺从兮丿象上越揚之形戶呉切平从丂八八分也符兵切語平舒也从力折渠卷切勞也倦同从刀去願切契也肉胾肉象形如六切月魚厥切大隂之精象形㲋丑略切獸青色似兔而大頭似兔足似鹿兔湯故切象踞後其尾形頭似㲋巂周燕也从隹􅋄㕯户圭切雋肥肉也从弓以射隹也徂流切袍从衣包薄褒切襺也袌从衣包薄保切褱也舠从舟刀五忽切船行不安也古服字箑从竹疌山洽切扇也或作䈉萐从艸疌七洽切萐蒲瑞艸也扇暑而涼从本卉呼骨切疾也奏則候切从本廾屮屮上進之義从水折子禮切沇也沛从水􅜨普盖切水名檢从木僉居奄切書也撿从手僉良冉切拱也捄从手求舉朱切盛土於梩中也毬从毛求巨鳩切鞠丸也氐从氏下箸一丁礼切至也木本从氏大於末居月切甘从口含一古三切美也下古丹字顫也从疒又于救切疛腹病也从疒肘省陟柳切􅘲象形工瓦切芉角也別作丱非卝古猛切古文磺从疒芉似陽切瘍也从芉爿則郎切牡芉也美从芉大無鄙切甘也羙从芉照省古牢切芉子也涕从水弟他礼切泣也洟从水夷他計切鼻液也米象形莫礼切禾實也采蒲莧切象獸爪分別也采从爫木倉宰切捋取也􅣴从爫禾徐醉切禾成秀从􅛣之省以灼切岸上見也屵从山􅛣五葛切岸髙也去从大厶丘折據切人相違也谷从口大象其理其虐切白从入合二旁陌切西方色也疾二切與自字同从心刀魚旣切怒也忍从心刃而軫切能也陝从􅊟㚒失冉切弘農陜也陜从􅊟夾矦夾切隘也俗作峽非猒从甘折於鹽折切飽也厭从厂猒於輒一淡二切笮也从衣㠭知扇切丹縠衣㞡从尸省知衍切轉也㘣从囗肙似沿切䂓也圓从囗員王問切圜全也弓以近窮逺象形居戎切下古及字百从一白博陌切十十也㐁从谷他念切舌皃旬从勹日詳遵切十日也䀏从目勻省黄絢切目揺菔从折艸服蒲北切蘆菔也箙从竹服房六切弩矢箙也􅹈从丌甶必至切付與也􅹈从廾甶渠旣切舉也目人眼象形莫六切下古良字困从囗木苦悶切故廬囷从囗禾去倫切廪之圜者拜博怪切揚雄說从兩手下拜居竦切揚雄說从兩手彔象形盧谷切下古魅字溼从水一土㬎省失入切幽溼也濕从水㬎他合切水名萑从艸隹職追切艸多皃萑从隹􅘲胡官切鴟屬有毛角􅜪从冂一莫保切重覆也冃从冂二莫報切頭衣也厂山石之厓人可居象形呼旱切广因广以爲屋象形魚儉切从又持巾尼輒切手疌巧聿从一余律切所以書也冣从冂取才句切積也最从冃取祖外切犯而取也臭从犬自尺救切臊也狊从犬目古闃切犬視也糸象形莫狄切細絲五忽系从糸丿胡計切繫也􅥽从子爻古肴切放也孝从老省子呼教切善事父母者晳从白析先擊切人白色也晢从日折旨熱切昭哲明也媱从女䍃曲肩行皃折余招切婬从女㸒私逸也餘箴切兀从一在人上五忽切髙而上平也尢从大象偏曲形烏光切㝿曲脛也豐从豆象豆之滿者也敷戎切豊从豆象形盧啓切行禮之器杗从木亾武方切棟也􅳒古文困字摩从手麻莫鄱切研也从手靡許爲切旌旗指癸象水从四方流入地中之形居誄切下古文共字从貝折余六切衒也賣从出買莫邂切出貨物也商从㕯章省式陽切从内知外也啻从口帝施智切語時不啻也从重八兵列切分也兆古文治小切从心折於力切滿也意从心音於記􅋀志也􅑰是爲切艸木華折葉􅑰也象形古懷切背呂也象形習从羽白似入切數飛也下古友字上古手字下古堯字墜从土隊直類切陊也下古地字槀从木高苦浩切枯也藳从禾髙古老切禾稈也諐諐上从言㑆胡禮切待也下籀文愆从言侃上古仁字下古夷字匚受物之器象形府良切匚从上有一覆之衺傒有所俠藏也胡禮切从乃西省如乗切驚聲或曰徃也从乃􅓒气行皃以周切㬱从白兓七感切曾折也㬱从曰兟他計切廢一偏下也从㞢土艸木妄折生也户光切从省从土古封字籀文折不省府容切瘍从疒昜與章切頭創也痬从疒易羊益切脉痬也晚莫也从日免無逺切睌大目視皃从目免武限切古文折字下古文孟字務趣也从力敄亡遇切㡔从巾敄䰍布也莫卜切士事也數始於一終於十推十合一鉏礼切土地中物出形它魯切盻恨視也从目兮胡計切盼美目也从目分匹莧切萁豆莖也从艸其渠之切箕簸也从竹其居之切脽折也示隹切从肉隹􅷥髀也徒䰟切或从肉隼袓事也从衣且才與切袒衣縫解也从衣旦丈萈切䁂大目也从目折臤矦簡切短深目也从目䀑烏括切䈰飯器也从竹捎所交切飯筥也从竹稍山樞切冕大夫以上冠也从冃免亾辨切冤屈也从免在冂下不得走於袁切筋肉之力也从力肉竹居銀切䇟筋之本也从筋夗省渠建切从􅛣異胥里切石利也廙从广異與職切行屋也㕡从折谷溝也呼各切或从土叡从目谷省以芮切深明也或从土䪗从韋叚乎加切履也䪗从韋段徒玩切履後帖也渜从水耎乃管切湯也濡从水需人朱切縱从系從緩也足用切緃从糸從省䋐也足容切亅鉤逆者謂之亅衢月切鉤識也从反亅居月切丂气欲舒出折上礙於一也苦浩切虎何切反丂也禾木之曲頭止不能上也古兮切禾从木􅑰省户戈切嘉榖也上髙也時掌切下底也胡雅切正从止一之盛切是也乏房法切反正以爲之止象艸木出有址故从止爲􅟦諸市切从反止他逹切爪覆手曰爪象形側狡切丮也从反爪諸兩切亦丮也丮象手有所丮據也几劇切持也从反丮居玉切持也又象形手也于救切􅚀手也象形臧可切卩象相合之形子結切瑞信也卩也側候切印从爪卩於刃切執政所持信也按也从反印於棘切后象人之形繼體君也胡口切司从反后臣司事於外者息玆切欠象氣从人上出之形去劒切从反欠飮食氣屰不得息曰居未切永長也象形于憬切折􅏨从反永水之衺流別也匹卦切首頭也象形書九切斷首倒縣古堯切之象艸過屮枝莖益大者所之一者地也止而切帀从反㞢而帀也子荅切胡辦切子象形古文作㜽即里切云不順忽出也从到子古文作㐬他骨切變也从到人呼跨切古文殄从反人天地之性最貴者也如鄰切􅎅相與比叙也从反人卑履切可肎也从口折肯我切叵不可也从反可普火切古文王字古文玉字上王雨方切中畫近上王者則天之義中王魚欲切三畫正均如貫王也下壬如林切位北方也象人褢妊之形上艸倉老切百卉也从二屮中居竦切竦手也从折又下􅦁暜班切引也从反上丈直兩切十尺也从又持十中􅠭土刀切滑也从又􅋄下支章移切从又持半竹上取七庾切捕也从又耳中而渉切使也从攴耴省下耴陟葉切耳垂也象形上折胡耿切吉而免凶也从屰夭中㚔尼輒切所以驚人也从大􅥷下古南字上折敷容切啎也从夂中夆乎盖切相遮要害也从夊丰下夅下江切服也从㐄相承不敢並上折即里切止也从盛而一横止之中市分勿切韠也象形下市時止切从冂􅗵之省買賣所之上冖莫狄切覆也从一下垂也中冂古熒切林外也下几居履切踞几也象形上干古寒切犯也从到入从一中如審切㨖也从干入一下屰魚㦸切不順也从干下凵上久舉友切象人兩脛後有距也中夂陟侈切象人兩脛後有致之者下夊楚危切象人兩脛有所躧也上大徒蓋切象人形中大他逹切大也下六力竹切易之數从入八上臼居玉切义手也从瓜中臼其九切象形下古齒字上䑣丑林切又以中切船行也又祭名中彤徒冬切丹飾也从丹彡下古丹字上折如延切从犬肉中䏙他感切肉汁滓也从肉冘下肬羽求切贅也从肉尤上段徒玩切推物也从殳耑省中叚古雅切借也下亦叚字譚長說叚如此上黕都感切滓垢也从黒冘中默莫北切从犬黒下古肬字上諡神至切行之迹也从言㿽中謚伊昔呼狄二切笑皃从言益下謐彌必切靜語从言从上折芉朱切束縛捽抴爲从中折余制切折也从丿下􅿼古蕢字上耹巨今切國語回禄信於耹从耳今中聆郎丁切聽也从耳令下郎丁切瓮似缾从瓦令上滔土刀切水大皃从水舀中淊胡感切泥水淊淊也从水臽下涵胡男切水澤多也从水圅上鈹敷覊切大鍼也一曰劒如刀􅏻者从金皮中鍜乎加切錏鍜也从金叚下鍛丁貫切小冶也从金段上㣇芉至切修豪獸从彑下象毛足中彖通貫切豕走也从彑从豕省下彖式視切豕也从彑豕上折户關切馬一歲也从馬一絆其足中折之戍切从馬二絆其足下􅎗陟立切从馬口其足絆馬也上从疾容切相聽也从二人中比毗至切宻也从反从下北博墨切也从二人相背上否方九切不也从口不中咅天口切相與語唾而不受也从亅否下㫘美畢切不見也从日否省上敲从攴髙横擿也口交切中毃从殳高擊頭也口卓切下歊从欠髙歊歊气出皃許嬌切上敺古文驅中毆烏后切从殳區捶擊物也下歐亦烏后切吐也从欠區上甾側詞切缶器也中息進切古囟字下凷从土一屈苦對切凷與塊同上岊陬隅高山之節从山卩子結切中屺山無艸木也从山已墟里切下古文扈从山􅝟上企舉踵也从人止去智切中仚人在山上呼堅切下匄氣也从亡人古代切聲相類竝五換切玩弄也从王元或从貝翫習厭也从習元竝子浩切璪王飾如藻之文从王喿璅石之似玉者从王巢竝力求切瑬垂玉也冕飾从玉流石之有光璧也从玉丣竝五關切環璧也从王瞏鍰鋝也从金爰竝胡果切禍害也神不福也从示咼屰惡驚詞从㒫咼竝去旣切气雲气也象形氣饋客芻米也从米气竝徒活切折手持隹失之从奞又􅴠彊取也从攴兌竝側狡切㕚手足甲也从又象形爪丮也覆手曰爪象形竝諸兩切掌手中也从手尚丮持也从反爪象形竝普伯切霸月始生霸也从月䨣魄隂神也从鬼白竝康礼切启開也从户口啟教也从攴启竝疾正切淨又士耕切魯北城門池从水爭瀞無垢薉也从水靜竝徒紅切童奴也从䇂重省僮未冠也从人童竝他得切忒更也从心弋失常也从心代竝徒朗切蕩水名从水􅛅潒漾水動揺也从水象竝苦昆切折無髮也从頁困鬄髮也从髟儿竝康狠切齧也狠从豕艮齦从齒艮訓同竝郎豆切屚屋穿水下也从尸雨漏以銅受水刻節百刻从水屚竝烏紺切闇閉門也从門音暗日無光也从日音竝五漑切閡門外閉也从門亥礙止也从石疑竝觕臥切折斬芻也从艸剉折傷也从刀竝子小切勦勞也从力巢絕也从刀喿竝魚折切屰不順也从干下凵屰之逆迎也从辵屰竝兵列切折分也重八相倚別分解也又憑列切从冎刀竝徐醉切㒸从意也从八豕遂亡也从辵㒸竝七感切憯痛也从心朁毒也从心竝側鳩切鄒魯縣古邾國顓帝之後所封从邑芻郰魯下邑孔子之郷也从邑取竝愚袁切邍从辵备录闕髙平之野人所登原水泉竝慈衍切㣤迹也从彳戔踐履也从􅟦戔竝古雅切假非真也从人从叚叚借也竝古懷切折戾也从􅘲兆背呂也象形竝徒弄切衕通街也从行同洞水疾流也从水同竝楚八切詧言微親詧也从言察省察覆也从宀祭竝昌眞切謓恚也从言眞瞋張目也从目眞竝職縁切叀从幺省屮小謹也專从寸叀六寸簿也竝山洽切翜捷也飛之疾也从羽夾翣棺羽飾也从羽妾竝昨千切􅋊賊也从歺戔禽獸所食餘也从歺肉竝力珍切麐牝麒也从鹿吝麟大牝鹿也从鹿粦竝穌困切顨折易卦爲折長女爲風者从丌巽具也从丌竝許嬌切哮豕驚也从口孝虓師子鳴从虎九竝薄折報切暴疾有所趣也从日出卄本􅕝虐也急也从虎武竝式陽切折行買也从貝商省商以外知内也从冏章省竝於今切􅙨雲覆日从雲今隂闇也水之南山之北也从􅊟侌竝將鄰切折气液也从血􅩎水渡也从水􅩎竝冬毒切䈞厚也从竹亯篤馬行頓也从竹馬竝於力切檍杶也从木意梓屬也从木竝側詵切折果實小如栗从木辛榛木也从木秦竝於六切郁地名从邑有有文章也从有竝薄回切􅘌河東聞喜縣从邑非裵裵回寛衣皃从衣非竝語期切折未定也从古文矢字疑惑也从子止矢竝矦閤切合合口也从口亼匌帀也从勹合竝親吉切桼木汁可䰍物象形漆水名从水桼竝治小切肁始開也从户聿擊也从攴肁竝他案切歎吟也从欠堇嘆吞歎也一曰大息也从口堇竝普䰟切歕吹气也从欠賁噴吒也鼓鼻也从口賁竝陟交切啁嘐也从口周嘲謔也通用啁字从口朝竝失廉切苫盖也从艸占䘮藉也从艸㑴竝郎段切亂治也从乚􅜆􅴛煩也从攴􅜆竝都昆切折厚也从心􅙯怒也又詆也从攴􅙯竝奴代切能忍也从肉足似鹿耐罪不至也从而寸或作奈同竝穌對切􅷢破也从瓦卒碎磨也从石卒竝徒古切􅩹閉也从攴度杜甘棠也从木土竝杜囘切頽禿皃从禿貴下隊也从􅊟貴竝古黠切折刮也又畫堅也从叏戞也从戈􅔣竝居許切􅞠飲牛筐也从竹豦筥䈰也从竹呂竝補各切簙局戲也从竹博博大通也从十􅌹竝先代切簺行棊相簺也从竹塞塞隔也从土竝奴歷切㲻没也从水人溺水名从水弱竝子礼切泲沇也从水濟水名从水齊竝章俱切朱赤心木松栢屬也从木一在其中絑純赤从糸朱竝去隓切闚閃也从門規窺小視从穴規竝力軌切垒絫墼也从土厽壘軍壁也从土畾竝兵折切啚嗇也从口㐭鄙五酇爲鄙从邑啚竝多朗切攩朋群也从手黨黨不鮮也从黑尚竝莫卜切牧養牛人也从攴牛坶坶野也周書武王與紂戰于坶野从土母竝力軌切誄謚也从言耒讄禱也累功德以求福从言纍省或作竝側加切樝果似梨而酢从木虘柤木閑也从木且竝吉蚪切朻髙木也从木丩樛下句曰樛从木翏竝徒朗切折放也从心象惕亦放也从心易又平也竝匹交切脬膀胱也从肉孚胞兒生裹也从肉包竝苦叶切㥦悏心也从心匧㤲思皃从心夾竝盧含切貪也訓同婪从女林惏从心林竝黄絢切眩目無常主也从目玄眴目揺也从目旬或作䀏同竝烏媧切䖯蠆从虫圭鼃蝦蟇也从黽圭俗作蛙非竝力卧切䇔痿也从立􅢓䌱不均也从糸䇔等字皆當从䇔乃得聲說文竝从羸恐譌竝五口切耦耒廣五寸爲伐二伐爲耦从耒禺偶桐人也从人禺竝苦故切胯股也从肉夸絝脛衣也从糸夸作袴非竝徐呂切叙次第也从攴余序東西牆也从广予竝他含切貪从貝今欲物也欿从欠臽欲得也竝毗祭切上㡀敗衣也从巾象形中敝同一曰帗也从攴㡀下弊頓仆从犬敝竝似嗟切上衺也从衣牙中邪又以遮切瑯琊郡名从邑牙下斜杼也从斗余竝是爲切上􅑰艸木葉􅑰也中垂逺􅡽也从土􅑰下小口罌从缶􅑰竝許斤切上忻闓也从心斤中欣笑喜也从欠斤下訢喜也从言斤竝古弚折切上噭吼也从口折敫二叫嘑也从口丩三髙聲也一曰大呼从竝孚梵切上泛浮也从水中氾濫也从水已下汎浮皃从水凡竝薄經切上蓱萍也从艸洴中萍苹也从水萍下苹蓱也从艸平符兵切無根浮水生者竝居六切上蘜治牆也从艸鞠中䕮曰精似秋蕐从艸􅯅省下菊蘧麥从艸匊竝子肖切上醮冠娶礼祭从酉焦中釂㱃酒盡也从酉嚼省下潐盡也从水焦竝户吳切上餬寄食也从食胡中黏也从黍古下䭈也从􅦧古竝以成切上嬴少昊氏之姓从女􅢓中贏有餘賈利也从貝􅢓徐鉉曰當从嬴省乃得聲瀛水名从水嬴竝郎果切上􅢓或曰嘼名象形中蠃蜾蠃蒲盧細腰土蠭也中从虫􅢓下袒也从衣􅢓與裸同也从人支下妓婦人小物也从女从支筆迹小異八博拔切折辵丑畧切彳丑亦切折廴余忍切行户庚切折牙五加切入人汁切折畗芳逼切复房六切折者之也切月魚厥切折􅝟乎感切齊徂兮切折秊奴顛切疒女疙切折人如鄰切匕呼跨切折老盧皓切舟職流切折俞芉朱切欠去劒切折旡居未切頁胡結切折駕古訝切文無分切折卯去京切永于憬切折谷古祿切魚語居切折􅍫居玉切户矦古切折門莫奔切也芉者切折氏承旨切建居萬切折所疏舉切久舉友切折我五可切乍鉏駕切折虫許偉切可肯我切折即子力切旣居未切折力林直切昔思積切折九舉有切子即里切折亥胡改切上正下譌天他前切折毒徒沃切走子茍切折歩薄故切乏房法切折章諸良切殳市朱切折以周切羽王矩切折鳥都了切焉有䖍切折畢卑吉切爭側莖切折􅊟房九切耒盧對切折乃奴亥切舍始夜切折㫃於幰切甬余隴切折录盧谷切西呼訝切折戎而中切衆之仲切折交古爻切老盧浩切折石常隻切而如之切折吳五乎切亢古郎切折囟息進切云王分切折非甫微切烏代切折俞羊朱切匄古代切折甚常枕切
